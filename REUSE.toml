version = 1

# All original code in this repository is licensed under Apache 2.0 with Swift
# exception.
[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "Copyright 2012-2026 Manas Technology Solutions."
SPDX-License-Identifier = "Apache-2.0 WITH Swift-exception"

# iyi: nothing is vendored any more. `markd` and `sanitize` went with the
# documentation generator and `reply` with the interpreter's REPL, so the
# entries that named them are gone rather than pointing at directories that
# are not there. `lib/*/**` stays: a shard installed into this checkout still
# carries its own licence.
[[annotations]]
path = ["lib/*/**"]

# iyi: `Math.exp`, `exp2`, `log`, `log2` and `pow` are Arm's optimized-routines ones
# (glibc's since 2.28), ported with their tables; the notice is beside the
# code as well. The math gate's oracle is Arm's files as published, with
# their own headers.
[[annotations]]
path = ["src/std/math.iyi", "bench/libm_oracle/exp.c", "bench/libm_oracle/exp_data.c", "bench/libm_oracle/pow.c", "bench/libm_oracle/pow_log_data.c", "bench/libm_oracle/pow_common.h", "bench/libm_oracle/log.c", "bench/libm_oracle/log_data.c", "bench/libm_oracle/exp2.c", "bench/libm_oracle/log2.c", "bench/libm_oracle/log2_data.c"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2018-2025 Arm Limited"
SPDX-License-Identifier = "MIT"

# iyi: `Math.fma`'s software arm is musl's `fma` and `fmaf`, in iyi; the
# notice is beside the code.
[[annotations]]
path = ["src/std/math.iyi"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2005-2020 Rich Felker, et al."
SPDX-License-Identifier = "MIT"

# iyi: `Math.erf`, `erfc`, `asinh`, `acosh`, `atanh`, `lgamma` and `tgamma`
# are CORE-MATH's, as
# glibc 2.43 carries them, and `atan`, `asin` and `acos` CORE-MATH's own,
# ported with their tables; the notice is beside the code. The math gate's
# oracle is glibc's files as published, with their own headers.
[[annotations]]
path = ["src/std/math.iyi", "bench/libm_oracle/core_math/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2022-2026 Alexei Sibidanov, Paul Zimmermann, Tom Hubrecht and Claude-Pierre Jeannerod"
SPDX-License-Identifier = "MIT"

# iyi: the port of kostya's crystal-metric that `bench/metric_port.sh` gates.
[[annotations]]
path = ["bench/metric/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2024 Konstantin Makarchev"
SPDX-License-Identifier = "MIT"

# iyi: `Math.log10`, `expm1`, `log1p`, `sinh`, `cosh` and `tanh` are glibc's
# fdlibm files, with Sun's notice, which is kept beside the port and in the
# oracle's copies.
[[annotations]]
path = ["bench/libm_oracle/e_log10.c", "bench/libm_oracle/s_expm1.c", "bench/libm_oracle/s_log1p.c", "bench/libm_oracle/e_sinh.c", "bench/libm_oracle/e_cosh.c", "bench/libm_oracle/s_tanh.c"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 1993 by Sun Microsystems, Inc."
SPDX-License-Identifier = "LicenseRef-SunPro"
