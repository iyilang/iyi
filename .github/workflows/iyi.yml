name: iyi

# The only workflow this fork runs.
#
# Crystal's own CI is a matrix of platforms, package managers, LLVM versions and
# release jobs for a project that ships all of them. iyi is Linux x86-64 plus a
# native darwin arm64 job, ships a tarball for each, and has one claim to
# protect.
# What was here before spent minutes on macOS, Windows, MinGW and wasm runs
# that nobody read and that no failure here would have been acted on; the
# darwin job below is not that — it runs the same gates a Linux push answers
# for, natively, because darwin arm64 is a run target now (SPEC.md III.4.8).
# CI that cannot fail for a reason somebody acts
# on is not a test, it is weather.
#
# The compiler is built once and handed to the rest, because building it five
# times is five times the minutes for the same binary.
#
# What each job is for:
#
#   iyi              the rules, the artifact, the import path: this fork's work
#   compiler-specs   Crystal's compiler suite. Every rule iyi adds is a change
#                    to the parser, the semantic passes or the codegen
#   stdlib-specs     Crystal's library suite. The compiler is still a Crystal
#                    program and is built with this library
#   samples          every sample, then the same programs built again with the
#                    modules' source deleted, which is R-1 taken literally
#   targets          the platform files the library still carries, type-checked
#                    by cross-compiling: an edit to `src/lib_c` or
#                    `src/crystal/system` is invisible here until somebody
#   binary           the thing a person downloads, unpacked somewhere else
#   std              the native standard library (src/std/) and its module exercises
#
# Every job carries a `timeout-minutes`. The default is six hours, and these
# jobs start daemons, listen on sockets, serve HTTP, soak an LSP and run
# aarch64 under qemu: one that hangs used to hold a runner for a working day
# and report nothing. The number is the job's own worst honest case, not a
# guess at its average.
on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Build the compiler"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: make crystal

      # v5 because it is current, and not because it silences the annotation
      # every run carries: "Node.js 20 is deprecated ... forced to run on
      # Node.js 24". That line names GitHub's own actions at their newest
      # tags — upload-artifact@v5, download-artifact@v5, cache@v4,
      # setup-go@v5 — so it is upstream's manifest and not this file's
      # version pins. Measured by bumping all twenty-one uses and reading
      # the next run: the warning came back naming v5.
      - uses: actions/upload-artifact@v5
        with:
          name: crystal
          path: .build/crystal
          retention-days: 1

  iyi:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The rules, the artifact and the import path"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      # Caught by hand once already, on files this fork wrote. `samples` is
      # checked because the formatter knows iyi now: before that it refused
      # every `.iyi` file, so checking them would have checked nothing, and
      # `bench` because it was the one tree of `.iyi` files nothing checked
      # and it had drifted.
      #
      # `make format check=1` rather than the directory list this step used
      # to spell out, so the command a developer runs and the command that
      # gates the branch are one command. The list behind it is what git
      # says the repository owns — which is also the fix for a developer
      # who followed `samples/crystal/kemal`'s own instructions: the
      # `shards install` that produces put other projects' source in a
      # `lib/` one directory down, past the formatter's top-level `-e lib`,
      # and `make format` then failed on code nobody here wrote.
      - name: Formatted
        run: make format check=1

      # A gate nothing runs passes on the machine that wrote it. Three did
      # exactly that in one release — `format_exercise`, `io_exercise` and
      # `socket_exercise`, nine seconds between them — and `panics.sh` was
      # a fourth in a narrower form: it ran on Linux and darwin and the
      # sentence it asserts is Windows' own. This is that lesson as a
      # check, and it needs no compiler, which is why it is here.
      - name: Every gate is reached by something that runs it
        run: python3 bench/gates_reachable.py

      # Which language a source is in is the one thing the lexer cannot read
      # out of its text, and a parse built without a name reads by the other
      # language's rules. That was a defect four separate times in one
      # release — stdin, the token scanner, macro expansions and a macro
      # body's formatter — so the seam is checked rather than remembered.
      - name: Every parse names the language it reads
        run: python3 bench/language_is_named.py

      - name: iyi's own specs
        run: |
          ./bin/crystal spec \
            spec/compiler/iyimod_spec.cr \
            spec/compiler/iyi_import_spec.cr \
            spec/compiler/semantic/iyi_spec.cr \
            spec/compiler/iyi_derive_spec.cr \
            spec/compiler/compiler_spec.cr

      # The command surface and the build daemon, which is iyi's own (SPEC.md
      # IV.1d) and which nothing else here runs. It caught two things the day
      # it was added: a spec still asking for a command this fork removed, and
      # `mod` refusing the prefixes every other command accepts.
      - name: The commands, and the daemon
        run: |
          export IYI_PATH="lib:$(pwd)/src"
          make -o .build/crystal cli_spec

  compiler-specs:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Crystal's compiler specs"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      # `-o .build/crystal` is make's "take this as up to date": the compiler
      # came from the job above and its timestamp is younger than the checkout.
      - name: Compiler specs
        run: make -o .build/crystal compiler_spec

  stdlib-specs:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Crystal's standard library specs"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      - name: Primitives specs
        run: make -o .build/crystal primitives_spec

      - name: Standard library specs
        run: make -o .build/crystal std_spec threads=1
        env:
          CRYSTAL_WORKERS: 1

  samples:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Samples, from source and from artifacts"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      # Built here so that what runs the samples is the binary a person
      # downloads, not the compiler under its Crystal name. The daemon's
      # server binary comes with it: `daemon start` execs it, so the
      # protocol gate below has nothing to start without it.
      - name: Build `iyi` and its daemon
        run: make -o .build/crystal iyi iyi-daemon

      # Each sample documents a part of the design, so a sample that stops
      # running is a part of the design that stopped working.
      - name: Run every sample
        run: |
          for sample in samples/iyi/*.iyi; do
            echo "== $sample"
            ./bin/iyi run "$sample" < /dev/null
          done

      # `calc` is the one sample that reads, so it is the one that can be run
      # twice: once on the program built into it, once on a program piped in.
      - name: The interpreter, on something typed at it
        run: |
          printf 'a = 6\nb = 7\na * b\n' | ./bin/iyi run samples/iyi/calc.iyi | grep -qx 42

      # The other library, and the seam between it and the rules. A program
      # under `--crystal` keeps every rule and gets Crystal's standard
      # library, and nothing else in this workflow builds one — the two are
      # meant to be independent, and this is what says so every build.
      - name: A program with Crystal's own library
        run: |
          for sample in samples/crystal/*.iyi; do
            echo "== $sample"
            ./bin/iyi run --crystal "$sample"
          done

      # `--debug` is a flag nothing here used to build with, and it was
      # broken for every program: iyi keeps a class's type id in the
      # object header word rather than in the struct, debug info kept
      # Crystal's rule that the id is field zero, and asking LLVM for
      # the field after the last one aborts the process on LLVM 21 and
      # answers a garbage offset before that. This builds with it, reads
      # the field offsets out of the compiler's own IR, and — where the
      # image has a debugger — asks it what the fields hold.
      - name: A program built with --debug, and its fields
        run: python3 bench/debug_info.py

      # The ecosystem and R-1 in one build (SPEC.md Part V item 12d). Built
      # twice with the module's source deleted in between, and the two runs
      # compared: the second one has Crystal's standard library *and* a module
      # it never opened.
      - name: A module with Crystal's library, through an artifact
        run: |
          work="$(mktemp -d)"
          cp -r samples/crystal/. "$work/"
          ./bin/iyi build --crystal --emit-iyimod "$work/mods" -o "$work/a" "$work/notes.iyi"
          "$work/a" > "$work/from-source.txt"
          rm -r "$work/notes"
          ./bin/iyi build --crystal --use-iyimod "$work/mods" -o "$work/b" "$work/notes.iyi"
          "$work/b" > "$work/from-artifact.txt"
          diff "$work/from-source.txt" "$work/from-artifact.txt"

      # And the guard rail that replaced the old one. The two libraries link
      # happily — same compiler, same mangling — and are wrong about every type
      # whose layout differs, so an artifact says which one it was built
      # against and importing across is refused in both directions.
      - name: The two libraries stay apart
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/app"
          printf 'module app/pure\n\npub def hello : String\n  "hi"\nend\n' > "$work/app/pure.iyi"
          printf 'module main\n\nimport app/pure\nusing app/pure\n\nputs hello\n' > "$work/main.iyi"
          ./bin/iyi build --emit-iyimod "$work/mods" -o "$work/out" "$work/main.iyi"
          if ./bin/iyi build --crystal --use-iyimod "$work/mods" -o "$work/out" \
               "$work/main.iyi" 2>"$work/err"; then
            echo "an iyi-prelude module was accepted under --crystal"; exit 1
          fi
          grep -q "built against iyi's prelude" "$work/err"

          rm -r "$work/mods"
          printf 'module app/pure\n\nrequire "json"\n\npub def hello : String\n  {"a" => 1}.to_json\nend\n' > "$work/app/pure.iyi"
          ./bin/iyi build --crystal --emit-iyimod "$work/mods" -o "$work/out" "$work/main.iyi"
          if ./bin/iyi build --use-iyimod "$work/mods" -o "$work/out" \
               "$work/main.iyi" 2>"$work/err"; then
            echo "a --crystal module was accepted under iyi's prelude"; exit 1
          fi
          grep -q "built against Crystal's standard library" "$work/err"

      # The claim R-1 makes, taken literally: build, delete the modules'
      # source, build again from the artifacts, compare what the two programs
      # print.
      - name: Build the samples again with their modules' source deleted
        run: bash bench/samples_roundtrip.sh

      # III.4, built in III.4.8's order: a scheduler, cancellable blocking
      # primitives, then `group` and `Channel`. Two arms because the context
      # switch is naked asm and the optimiser is what corrupted it once; two
      # failure proofs because a gate that cannot fail is not a gate.
      - name: The concurrency runtime holds III.4's properties
        run: bash bench/concurrency_exercise.sh

      - name: The runtime exercise holds III.4's properties
        run: bash bench/runtime_exercise.sh

      # The shape those primitives are actually used in: a fiber per
      # connection, both halves parked on the poller, and a collection
      # in the middle. Two crashes lived here — the poller's event
      # buffer held as a number the collector could not see, and a
      # finished fiber's stack never handed back — and both failure
      # proofs are in the gate.
      - name: A server's shape survives its own collector
        run: bash bench/server_load.sh

      # III.1.4: a panic kills the task, not the process — defers run
      # by registry, the boundary re-raises once, `.or_panic` is real.
      - name: A panic dies at its boundary, cleanly
        run: bash bench/panics.sh

      # And the registry's price, measured so it cannot quietly grow:
      # the same loop with and without a defer, release mode, budgeted.
      - name: A defer costs nanoseconds, and stays priced
        run: bash bench/defer_cost.sh

      # `Float64#to_s` is the shortest decimal that reads back, in
      # Crystal's notation, and `String#to_f` the correctly rounded
      # double, on the prelude's own bignum; three mutations fail by name.
      - name: A float prints as the shortest decimal that reads back
        run: bash bench/float_text.sh

      # The prelude's `Enum` surface, which the compiler depends on in three
      # places it writes itself: a `when` naming a member lowers to `===`, a
      # per-member question method is `self == Member`, and a `@[Flags]`
      # enum's is `includes?`. All three answered `Object`'s defaults until
      # `samples/iyi/enums.iyi` asked, so `==` was false and `case` matched
      # nothing. Eight broken methods of a copied prelude prove each check.
      - name: An enum is its name, its order and its members
        run: bash bench/enum_exercise.sh

      # And the same question asked of the two values the prelude writes
      # itself: a tuple and a range. Neither had `==` or `hash`, so
      # `Object`'s answered — identity, on a value — and `{1, 2} == {1, 2}`
      # and `(1..3) == (1..3)` were both false, which made either one
      # unfindable as a key, a `Set` of them a list, and
      # `includes?`/`index`/`uniq` over `zip`'s own result answer no. Ten
      # broken methods of a copied prelude prove each check.
      - name: A tuple and a range are their members
        run: bash bench/value_exercise.sh

      # And the integers at their edges, which is where a number stops
      # behaving like the mathematics: `Int32::MIN` could not be read back
      # from its own `to_s` (the parser built the positive magnitude, and
      # with checked arithmetic that was a panic where `to_i?` promises
      # nil), and `MIN // -1` was left to the processor, which reports an
      # integer divide as a floating-point fault and kills the program.
      # Six broken methods of a copied prelude prove the checks, and a
      # seventh proof asks for the signal itself.
      - name: Numbers print, read back, and refuse what does not fit
        run: bash bench/number_exercise.sh

      # And the three collections a program gets, at their edges: a key
      # written twice, a table grown past its first capacity, a key deleted
      # with the rest still findable, keys that all land in one slot, an
      # array appended to itself. The last one is why this gate exists -
      # `a.concat(a)` walked the other array's growing size and grew the
      # buffer until the capacity arithmetic overflowed. Eight panics with
      # names and eight broken methods of a copied prelude.
      - name: Arrays, hashes and sets at their edges
        run: bash bench/collections_exercise.sh

      # And what the commands say when they refuse. Every case is a mistake
      # a person makes at the command line, and the claim is one sentence
      # rather than a stack trace: `iyi daemon start --socket <a path past
      # the kernel's limit>` used to die with "Path size exceeds the maximum
      # size of 107 bytes (ArgumentError)" and a backtrace through
      # `src/socket/address.cr`. The gate's trace detector is proved against
      # a recording of that crash.
      - name: What the verbs say when they refuse
        run: bash bench/verbs_exercise.sh

      # And the first verb a person types. `iyi init` was refused with a
      # sentence about a checkout the zip does not carry; it writes a
      # project now, and the claim is that all four files are right the
      # moment they land — the entry runs, the test passes, the pack grounds
      # the import, and a second `init` changes not one byte.
      - name: A project, from nothing
        run: bash bench/init_project.sh

      # And what it does when the client is not a client. Every frame in
      # this gate used to kill the daemon outright, the analysed prelude
      # with it: a connection that closes before it speaks (Ctrl-C during
      # a build), a length header with nothing behind it, a body that is
      # not JSON, a 4 GB header through the allocator, a request with no
      # `cwd`, and a refusal written to a client that had already hung up
      # - EPIPE, which `Command#run` answers with `::exit 0`, so the
      # daemon exited *successfully* mid-sentence. A second `daemon start`
      # on a live socket unlinked the first daemon's address and left it
      # running behind a socket with no name.
      - name: One client's mistake is one client's mistake
        run: python3 bench/daemon_protocol.py

      # And whether the program it built is the same program. The daemon
      # forks a child per build, so the child starts from a prelude this
      # build's command line never configured: every switch that matters
      # is re-applied to it, and the compiler can force somebody to *name*
      # the list a new switch belongs to without telling them they named
      # the right one. Delete the line that re-applies `use_iyimod` and
      # this is what notices — the plain build answers and the daemon's
      # fail.
      - name: The daemon builds the same program a plain build does
        run: python3 bench/daemon_agrees.py

      # Three gates that existed, passed on the machine that wrote them, and
      # were named in this file by nothing: `format_exercise` (seven proofs
      # over patched copies of `std/format`), `io_exercise` (`IyiIO` flush,
      # short reads, buffer boundaries, EOF) and `socket_exercise` (every
      # phase of `IyiSocket` plus a refused connection). Nine seconds for the
      # three of them, which is what an unrun gate was saving. Found while
      # reviewing what CI actually runs; the collector's comment below
      # records the same defect a stage earlier.
      - name: Format strings, streams and sockets
        run: |
          bash bench/format_exercise.sh
          bash bench/io_exercise.sh
          bash bench/socket_exercise.sh

      # The collector's own gates (GC_DESIGN.md Stages 2, 3, 5, 6, 10 and the
      # allocation-pressure trigger). Each drives its exercise plain and
      # optimised, audits what the `-Dgc_iyi` binary asks the machine for,
      # and proves its checks can fail. Found unwired while building the
      # trigger: the collector merged with these gates green on the machine
      # that built it and none of them named in this file — which is the
      # exact defect this file exists to prevent.
      #
      # `windows_exercise.sh` is the sixth, and it was the same defect a
      # second time: the Windows job below links and runs
      # `bench/windows_exercise.iyi`, which is the *exercise*, while the
      # driver that proves those checks can fail ran nowhere. It needs no
      # Windows — a host run, a cross-compile to `x86_64-windows-msvc` that
      # stops at the object, and three patched-prelude proofs — so it runs
      # here, in under two seconds.
      - name: The collector holds, all seven gates
        run: |
          bash bench/arena_exercise.sh
          bash bench/root_exercise.sh
          bash bench/mark_exercise.sh
          bash bench/sweep_exercise.sh
          bash bench/reuse_integrity.sh
          bash bench/collect_trigger.sh
          bash bench/windows_exercise.sh

      # The rebuild loop, held: cheap on both arms, and the artifact
      # read inside its band — the corrected prediction is in SPEC.md.
      - name: The edit-rebuild loop stays cheap
        run: python3 bench/rebuild_speed.py

      # `iyi migrate`: a Crystal project written out as iyi modules, on a
      # fixture that plants every case the rewrite has to answer — a
      # namespace over several files, an `include` of one, a two-file
      # import cycle, `JSON::Serializable`, a reopening of `Int32`, a
      # `not_nil!`, an ECR template embedded by a project-relative path,
      # an untyped def whose types `--annotate` reads off the calls, and
      # both bangs a rewrite has to tell apart — Crystal's in-place
      # member and one the tree defines itself.
      # The gate is that the migrated tree prints what the Crystal one
      # printed, that every module compiles alone, that each planted case
      # is named in the notes, that the annotated tree emits artifacts and
      # builds from them — which is R-2 satisfied and the thing a
      # migration is for — and that `--out src` is refused, because a
      # verb whose first mistake edits the project is not one a person
      # tries twice.
      - name: A Crystal project becomes iyi modules, and answers the same
        run: bash bench/migrate_gate.sh

      # R-4 as built, measured: bodies travel in the artifact and object
      # code stays; of what a consumer's front end reads, the share that
      # is bodies it compiles again is held under a line, and the two
      # ends of the spectrum — a module that is all generics, one that
      # has none — are pinned to the shape the rule gives them.
      - name: Generics crossing a boundary cost what the SPEC says
        run: python3 bench/generic_boundary.py

      # III.7 step 1: iyi.mod, minimal version selection, a git fetcher —
      # run entirely against a local mirror of bare repositories, so the
      # network is not a dependency of the gate.
      - name: Packages resolve by minimal version selection
        run: bash bench/packages_resolve.sh

      # AI_FIRST.md §5's token arm: the context pack must be smaller than
      # the sources it replaces, and must carry no body. The rounds arm
      # needs a model and runs by hand: --agent 'claude -p'.
      - name: The context pack pays for itself
        run: python3 bench/context_pack.py

      # AI_FIRST.md §2 #4: `iyi test`, the verify loop with no framework. A
      # test is a plain program with an exit code; the gate's four steps are
      # the four verdicts a runner must tell apart.
      - name: The test verb tells its four verdicts apart
        run: bash bench/test_verb.sh

      # SPEC.md III.8 #2: the language server. One scripted session is a
      # person's first five minutes plus the agent's first question, and
      # every capability the release claims is a step: diagnostics with
      # SPEC sections as data, hover, definition, the outline, the
      # context pack over the wire, and an unsaved sibling buffer seen
      # through an import while the disk stays untouched.
      - name: The language server holds its session
        run: python3 bench/lsp_session.py

      # And the same session in the workspace R-1 exists for: the
      # dependency is a `.iyimod` and its source is gone. The build has
      # been gated on that since `samples_roundtrip.sh`; the editor had
      # never been asked, and answered `can't find module` about a module
      # the build compiles against.
      - name: The language server answers from an artifact
        run: python3 bench/lsp_artifacts.py

      # What the commands that read an import without building answer,
      # against what a build does. Here rather than with the specs
      # because both need the binary this job builds: `mod diff`'s
      # verdict was wrong for the edit that matters most — a block-taking
      # def's body is compiled by the *consumer*, and the verdict read
      # the interface hash alone — and `mod context` never looked at
      # `IYI_PATH`, so every import of a library module was reported as a
      # module that does not exist.
      - name: mod diff answers what a rebuild would show
        run: bash bench/mod_diff.sh

      - name: Every import is grounded, in every workspace shape
        run: bash bench/mod_context.sh

      # The agent's loop, scripted and asserted: ground (context pack,
      # budget ladder), check (verdict as data, suggested_edit), fix
      # (the compiler's own edit applied to convergence), test
      # --affected (exact selection by parsed closure), and the MCP
      # server answering the same over the wire. The sandbox steps run
      # where the wasi job's toolchain exists and skip loudly here.
      - name: The agent loop holds end to end
        run: python3 bench/agent_loop.py

      # And the speed half of the same claim: percentiles per verb over
      # the sample corpus, a p95 over budget names its verb and fails.
      - name: The language server answers inside the budget
        run: python3 bench/lsp_latency.py

      # The first screenshots found partially colored words (a reused
      # Token's dirty `raw`); this sweeps every sample's token stream
      # and refuses a token that does not cover its whole word.
      - name: The highlighting colors whole words
        run: python3 bench/lsp_token_boundaries.py

      # "Being there on the next keystroke is the server's whole value";
      # this abuses the transport — garbage frames, bad UTF-8, malformed
      # params, a 1,500-def module — and demands a hover after each.
      - name: The language server does not flinch
        run: python3 bench/lsp_soak.py

      # And the question from a position nobody chose. The soak above asks
      # one hover after each abuse; this asks every cursor question at
      # thousands of positions across `src/std`, including the two shapes
      # the answers were wrong on — a macro directive line and a local
      # assignment, where a variable an arm this target does not take has
      # no type and a visitor read it anyway. Eighteen internal errors
      # were found that way and nothing here had asked.
      - name: Every cursor question, everywhere in the library
        run: python3 bench/lsp_positions.py

      # The server is two processes because `iyi` carries no collector: a
      # proxy that keeps the protocol and the buffers, and a worker that
      # compiles and is retired once it has cost enough. Measured before
      # the split: forty edits and hovers took one server to 1,636 MB,
      # and a session of `references` reached 19 GB and was killed by
      # the kernel mid-keystroke. This drives the same traffic and reads
      # the tree's resident megabytes from `/proc` — and kills the
      # worker outright, because "a crash is one bad answer" is the
      # other half of what the split bought.
      - name: An hour of editing costs what is open, not how long
        run: python3 bench/lsp_memory.py

      # The same question asked of the other kind of artifact: one whose object
      # code is a shard's and whose declarations `tool bind` wrote. III.6 rule 1
      # names an undefined symbol and a call returning another type, and
      # `bind_spec.cr` reaches neither because it never links. This links, runs,
      # and compares — which is how the return-type mismatch was found.
      - name: A bound shard, built from its boundary and run
        run: bash bench/bind_roundtrip.sh

      # Two boundaries rather than one, because that is what it takes to ask
      # whether a name the compiler invented is an identity. A regex literal
      # becomes a constant named by the compiler, the name reaches the linker,
      # and both shards below numbered their own from zero — so the second one
      # matched against the first one's pattern, silently, with every other
      # gate here green.
      - name: Two bound shards keep their own regex literals
        run: bash bench/bind_regex_identity.sh

      # A module held as a type, whose includers the consumer adds to (III.6).
      # Forty lines and no network: the shard's two includers are compiled into
      # the artifact's dispatch, the consumer writes a third, and before this
      # rule the program printed half a line and stopped — which is what a
      # kemal application did one request in. The arm with `IYI_OPEN_TRAVEL=off`
      # is what keeps this gate honest: it still prints half a line.
      - name: An open type's members are the program's answer
        run: bash bench/open_dispatch.sh

      # And a chain of four, installed from the network. One boundary cannot
      # collide with another's synthesised names, cannot have an import edge to
      # get wrong, and cannot be a *class* root standing beside module roots —
      # `ExceptionPage` is one, and a class root's declarations used to be
      # wrapped in a module of the class's own name.
      - name: A chain of four bound shards, built against and run
        run: bash bench/bind_chain.sh

      # The README's headline example, taken literally: `require "kemal"` in an
      # `.iyi` file, built `--crystal`, answering over HTTP. The synthetic shard
      # in the tarball job proves the library ships whole; it cannot prove that
      # a real shard's macros parse, that its route blocks compile, or that the
      # thing serves. This reaches the network, which no other gate here does,
      # and the shard is pinned so it fetches one version rather than today's.
      - name: A real shard, built and served
        run: |
          # The crystal docker image is a compiler toolchain. It ships `shards`,
          # and it does not ship `curl` — the reason the identity gate below
          # installs Python. Asking for a page is the point of this step, so
          # the client it asks with cannot be assumed.
          if ! command -v curl >/dev/null; then
            apt-get update -qq && apt-get install -y -qq curl
          fi
          bash bench/shard_serves.sh

      # The same application, through four boundaries instead of from source.
      # `bind_chain.sh` above adds a route by calling the router; this one
      # writes `get "/" do … end` and answers a request, which is what a kemal
      # user does. Everything between those two is the DSL crossing, `Kemal.run`
      # crossing with its body, the handler chain running in kemal's own order,
      # and what the shard added to `HTTP::Server::Context` — a class the
      # library owns — arriving with it. Each of those failed quietly once, and
      # a gate that stopped at "it compiles" was green through all of them.
      - name: A kemal application, served through four boundaries
        run: |
          if ! command -v curl >/dev/null; then
            apt-get update -qq && apt-get install -y -qq curl
          fi
          bash bench/kemal_serves.sh

      # And a shard of a different kind, because the one above reaches nothing
      # outside Crystal's own library. `jwt` reaches OpenSSL through a reopened
      # `lib`, and under it `bindata` writes classes with macros that write
      # classes and hangs an exception hierarchy off `Exception`. What that
      # exercises is not what kemal exercises: a `fun` a travelling body calls,
      # a `lib` constant, a class variable four subclasses share the name of, a
      # `to_s` reached through a class held virtually. A token is a signature
      # over bytes, so this fails loudly where a boundary that dropped a field
      # would otherwise just sign something else.
      - name: A signed JWT, through four boundaries
        run: bash bench/jwt_signs.sh

      # And a *pair* of shards, which is a third kind again. `db` declares what
      # a driver must answer and never sees one; `sqlite3` answers it and never
      # sees `db`'s source. Every `abstract def` in between is a place where
      # the producer compiled a body against nothing at all — `db`'s
      # `Connection#fetch_or_build_prepared_statement` calls an abstract
      # `build_prepared_statement`, and the copy in `db`'s artifact returns its
      # own argument. Linked over the consumer's copy it handed back a
      # statement whose `crystal_type_id` was 1. Rows read back wrong rather
      # than a build that fails, which is why this runs a real query.
      - name: A SQLite query, through a driver behind an abstract boundary
        run: |
          # The *dev* package, and the test has to ask for that rather than for
          # the library. `ldconfig -p` lists the runtime `libsqlite3.so.0`,
          # which this image already has; what `-lsqlite3` needs is the
          # `libsqlite3.so` symlink beside it, and only the dev package
          # installs that. Asking the first question answered "already there",
          # the install was skipped, and the link ended on `unable to find
          # library -lsqlite3` — with ld.lld saying which package was missing.
          if ! find /usr/lib /usr/lib64 -name libsqlite3.so -print -quit 2>/dev/null | grep -q .; then
            apt-get update -qq && apt-get install -y -qq libsqlite3-dev
          fi
          bash bench/sqlite3_queries.sh

      # And a boundary built from the standard library itself, which is not a
      # shard and asks a question no shard asked: `YAML` calls libyaml, and
      # which C libraries a boundary's object code needs was a question the
      # format did not answer. A consumer that replays `require "yaml"` has the
      # `lib` and its `@[Link("yaml")]` and drops the flag anyway, because a
      # flag comes from the libs *this* build marked used and the call is in an
      # object file it reads rather than compiles.
      - name: A YAML document, through a boundary built from the library
        run: bash bench/yaml_reads.sh

      # And twelve of the library's own namespaces, because what a boundary
      # breaks on depends on what the namespace holds. `Log` is the one that
      # found the most: global state written by macros — a private constant, a
      # class variable with a live initialiser, and two `{% for %}` loops that
      # write a method of the same name on both sides of the class. `Path` and
      # `Time` found that a constant has two spellings and a boundary has to
      # carry both; `Random` found that a module is a mixin on the other side
      # of one. The other six found nothing, which is why they are here: a gate
      # that holds only what once broke says nothing about what never did.
      - name: Twelve library namespaces, bound and consumed
        run: bash bench/library_boundaries.sh

      # A library arriving with a feature is a decision, and this is where it
      # gets noticed. Seven undefined symbols in any iyi program (SPEC.md III.9),
      # and a new one fails here rather than on somebody's machine.
      - name: The dependency floor
        run: bash bench/dependency_floor.sh

      - name: The build tool floor
        run: bash bench/build_tool_floor.sh

      # What a kernel thread costs that floor, measured before anything is
      # designed on one (GC_DESIGN.md Stages 4, 7, 8, 9; III.4.7's `Share`):
      # raw `clone`, a `tgkill` stop-the-world, a futex join, and the
      # assertion that none of it put a symbol on the link line. The pause
      # numbers are printed, not budgeted — a shared runner's clock is
      # weather — the aarch64 arm runs in cross-run, and the darwin arm,
      # libSystem's pthreads held as an exact list, in the darwin job.
      - name: The thread floor
        run: bash bench/thread_floor.sh

      # Threads under the collector (GC_DESIGN.md Stage 4, src/iyi/thread.iyi):
      # the probe's mechanism in the runtime — eight threads allocating from
      # their own caches, collections stopping them where they run, every
      # stopped thread's frames scanned as roots, a live list in each
      # surviving by checksum and by the sweep's flag, and 32 threads past
      # the core count. The floor: five names, nothing added. The failure
      # proof removes the thread-root walk and the list is swept by name.
      - name: Threads under the collector
        run: bash bench/thread_exercise.sh

      # The parallel marker (GC_DESIGN.md Stage 7): a million-node tree
      # marked alone and with helpers, the helpers' share asserted, the two
      # pauses printed, and the proof that a marker which never shares its
      # stack is refused.
      - name: The parallel marker
        run: bash bench/parallel_mark.sh

      # The mark beside the program (GC_DESIGN.md Stage 9): twenty-four
      # rounds each move a payload out of an unmarked chain into a
      # blackened holder under a running mark and read it back intact, the
      # two stops printed beside the stopped mark's one, and the proof that
      # a barrier which shades nothing loses the payload.
      - name: The mark beside the program
        run: bash bench/concurrent_mark.sh

      # iyi is a permanent fork, so Crystal's name standing in for iyi's is a
      # defect and not a detail. Both layers: a tree that should have been
      # renamed, and a name left inside a file that was otherwise cut over.
      # Every allowed occurrence carries its reason in the script.
      - name: iyi owns its name
        run: |
          # The crystal docker image is a compiler toolchain, not a Python one.
          # This gate is Python because the first draft was `grep -P` and the
          # grep a script resolves has no `-P`, so every allowlist test errored
          # and the gate failed open. Installing Python here is cheaper than
          # rewriting the matching in a language whose regex we would then have
          # to re-prove.
          if ! command -v python3 >/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3
          fi
          python3 bench/identity_floor.py

      # The docs quote sizes as facts a reader can check. Three times a number
      # has gone stale unnoticed, the last one repeated in eleven places, so it
      # is measured here rather than trusted. Python is already installed by the
      # step above.
      - name: The numbers the docs state
        run: python3 bench/doc_numbers.py --list

      # And the numbers the docs quote from an instrument rather than from the
      # tree. A shared runner cannot re-measure a second or a megabyte — the
      # scripts that produce them refuse an unoptimised compiler, and the same
      # binary has read 0.048 s and 0.109 s minutes apart on one machine — so
      # this checks the half that does not move: that the rows, columns, sizes
      # and parameters a sentence quotes are ones its instrument still
      # produces. It found a table whose columns named a flag the script had
      # stopped passing, which is a measurement no reader could repeat.
      - name: The numbers the docs quote from a measurement
        run: python3 bench/measured_numbers.py

  std:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The native standard library and its module exercises"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal
      - name: Build iyi binary
        run: make -o .build/crystal iyi
      - name: The standard library foundation and discovered exercises
        run: bash bench/std_exercise.sh

  targets:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The platforms the library still carries"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      # Cross-compiling type-checks that platform's `src/lib_c` and
      # `src/crystal/system` without needing the platform. It emits an object
      # and links nothing, so a library missing from this runner is not a
      # failure and a declaration missing from the source is.
      - name: Type-check the standard library for each target
        run: |
          echo 'puts "hi"' > /tmp/hi.cr
          status=0
          for target in x86_64-linux-gnu x86_64-linux-musl aarch64-linux-gnu \
                        arm-linux-gnueabihf x86_64-darwin aarch64-darwin \
                        x86_64-w64-mingw32 x86_64-windows-msvc wasm32-wasi; do
            printf '== %-24s' "$target"
            if ./bin/crystal build --cross-compile --target "$target" \
                 -o "/tmp/cross-$target" /tmp/hi.cr > "/tmp/log-$target" 2>&1; then
              echo ok
            else
              echo FAILED; cat "/tmp/log-$target"; status=1
            fi
          done
          exit $status

      # iyi: the same cross-compile, for an iyi program rather than a Crystal
      # one, and then read what the object actually asks the machine for. This
      # is where "supports the platform out of the box" is either true or not:
      # a target that type-checks can still emit a call nothing supplies, which
      # is how `__multi3` went missing on wasm32 and arm.
      #
      # Each format is read by its own extension. `.o` for ELF and Mach-O,
      # `.obj` for Windows, `.wasm` for wasm32. Reading the wrong one prints
      # nothing and looks like a pass, which is exactly how two defects here
      # survived their first audit.
      - name: Build `iyi` for the per-target audit
        run: make -o .build/crystal iyi

      - name: What an iyi program asks each platform for
        run: |
          status=0
          for target in x86_64-linux-gnu aarch64-linux-gnu x86_64-darwin \
                        aarch64-darwin x86_64-windows-msvc x86_64-windows-gnu \
                        wasm32-wasi; do
            # `io`, `socket` and `format` are here for a reason a shorter list
            # would have hidden: each carries per-platform branches, and a
            # branch only its own platform compiles is a branch nobody checks.
            # `socket.iyi` reached master's queue with `UInt32#to_i64` in its
            # Linux syscall path, a method this prelude does not have, and a
            # darwin machine compiled it every time because darwin takes the
            # libSystem branch instead.
            for sample in hello webapp io socket format; do
              out="/tmp/iyi-$sample-$target"
              if ! ./bin/iyi build --cross-compile --target "$target" \
                    -o "$out" "samples/iyi/$sample.iyi" > "$out.log" 2>&1; then
                echo "== $target $sample FAILED"; cat "$out.log"; status=1; continue
              fi
              obj=""
              for candidate in "$out.o" "$out.obj" "$out.wasm"; do
                [ -f "$candidate" ] && obj="$candidate" && break
              done
              if [ -z "$obj" ]; then
                echo "== $target $sample emitted no object this script knows how to read"
                status=1; continue
              fi
              printf '== %-22s %-7s %s\n' "$target" "$sample" \
                "$(llvm-nm --undefined-only "$obj" 2>/dev/null |
                     awk '{ print $NF }' | sed 's/^_*//' | sort -u | tr '\n' ' ')"
            done
          done
          exit $status
  # Portability, taken past "the code generator has no objection". The README
  # says an iyi program compiles for nine targets and is run on four of them;
  # these jobs are the musl, aarch64 and Windows runs, and the native job is
  # the fourth.
  #
  # Split in two because a job with a `container:` cannot run docker, and
  # running the program means running it somewhere else: the object is produced
  # here, under the compiler's own image, and linked and run there.
  cross-objects:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: crystallang/crystal:1.21.0-build
    name: "Objects for other targets"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal
      - name: Build `iyi`
        run: make -o .build/crystal iyi

      # What the program prints here is what it has to print there. Taken from
      # a native run rather than written down, so the two cannot drift.
      - name: Cross-compile hello for musl, aarch64, Windows and wasm
        run: |
          mkdir -p cross
          ./bin/iyi run samples/iyi/hello.iyi > cross/expected.txt
          ./bin/iyi build --cross-compile --target x86_64-linux-musl \
            -o cross/hello-musl samples/iyi/hello.iyi
          ./bin/iyi build --cross-compile --target aarch64-linux-gnu \
            -o cross/hello-aarch64 samples/iyi/hello.iyi
          # The Windows link is not written down here: it is whatever
          # `--cross-compile` prints, saved and run as-is on the runner, so the
          # command a person is told to type is the command that is tested.
          ( cd cross && ../bin/iyi build --cross-compile \
              --target x86_64-windows-msvc -o hello-windows \
              ../samples/iyi/hello.iyi > hello-windows.link )
          cat cross/hello-windows.link
          ( cd cross && ../bin/iyi build --cross-compile \
              --target wasm32-wasi -o hello-wasi \
              ../samples/iyi/hello.iyi > hello-wasi.link )
          cat cross/hello-wasi.link

          # The concurrency runtime's other instruction set, under the other
          # kernel: the x86-64 arm of its asm runs in this workflow's own
          # gate, the darwin job runs aarch64 natively against kqueue, and
          # nothing runs the *Linux* aarch64 arm — the raw syscall shims,
          # the epoll numbers — until the emulation job below does. musl
          # rides along: same instructions, the other libc, linked natively.
          ./bin/iyi build --cross-compile --target x86_64-linux-musl \
            -o cross/conc-musl bench/concurrency_exercise.iyi
          ./bin/iyi build --cross-compile --target aarch64-linux-gnu \
            -o cross/conc-aarch64 bench/concurrency_exercise.iyi
          # The thread floor's aarch64 arm: raw `clone`, `futex`, `tgkill`
          # and a signal handler with the kernel's vdso sigreturn, none of
          # it run anywhere else. Its x86-64 arm is bench/thread_floor.sh in
          # the samples job.
          ./bin/iyi build --cross-compile --target aarch64-linux-gnu \
            -o cross/floor-aarch64 bench/thread_floor.iyi
          # Threads under the collector, the aarch64 arm: the runtime's own
          # `clone`, the stop, the roots of a stopped thread, on a real
          # arm64 kernel under emulation in cross-run.
          ./bin/iyi build --cross-compile --target aarch64-linux-gnu \
            -o cross/threads-aarch64 bench/thread_exercise.iyi

          # The Windows probe: the two shapes whose output has been seen wrong,
          # a case conversion and a number rendered into a string — then the
          # same two shapes 50,000 times, self-checked, because the two-line
          # form sat green while the defect was live. The suspect is named
          # now (the prelude's memset strode eight elements per eight bytes,
          # fixed with the collector's merge): the loop is what makes a
          # packed-heap trample probable instead of lucky, so twenty green
          # runs of *this* probe mean more than twenty of the old one.
          cat > cross/strings.iyi <<'IYI'
          module probe

          puts "hello, iyi!".upcase
          puts "BEEP " + 7.to_s

          bad = 0
          index = 0
          while index < 50000
            shout = "hello, iyi!".upcase
            beep = "BEEP " + index.to_s
            bad = bad + 1 if shout != "HELLO, IYI!"
            bad = bad + 1 if beep.size < 6
            index = index + 1
          end
          puts "loop: " + bad.to_s + " bad of 50000"
          IYI
          ./bin/iyi run cross/strings.iyi > cross/strings-expected.txt
          cat cross/strings-expected.txt
          ( cd cross && ../bin/iyi build --cross-compile \
              --target x86_64-windows-msvc -o strings-windows \
              strings.iyi > strings-windows.link )
          cat cross/strings-windows.link
          ls -l cross
          ( cd cross && ../bin/iyi build --cross-compile \
              --target x86_64-windows-msvc -o windows_exercise \
              ../bench/windows_exercise.iyi > windows_exercise.link )
          cat cross/windows_exercise.link
          ( cd cross && ../bin/iyi build --cross-compile \
              --target x86_64-windows-msvc -o runtime_exercise \
              ../bench/runtime_exercise.iyi > runtime_exercise.link )
          cat cross/runtime_exercise.link
          ( cd cross && ../bin/iyi build --cross-compile \
              --target x86_64-windows-msvc -o tls_probe \
              ../bench/tls_probe.iyi > tls_probe.link )
          cat cross/tls_probe.link

      - uses: actions/upload-artifact@v5
        with:
          name: cross-objects
          path: cross/

  cross-run:
    needs: cross-objects
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "An iyi program, run on musl and on aarch64"
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cross-objects
          path: cross

      # aarch64 runs under emulation; musl runs natively and only the libc
      # differs. Both link the object with the target's own `cc` and `libgc`,
      # which is the command `--cross-compile` printed.
      - uses: docker/setup-qemu-action@v3

      - name: musl, natively
        run: |
          docker run --rm -v "$PWD/cross:/w" -w /w alpine:3.20 sh -c '
            apk add --no-cache build-base gc-dev > /dev/null &&
            cc hello-musl.o -o hello-musl -lgc -lpthread &&
            ./hello-musl > got.txt &&
            cc conc-musl.o -o conc-musl &&
            ./conc-musl > conc.txt
          '
          diff cross/expected.txt cross/got.txt && echo "musl: same output"
          grep -q "every property held" cross/conc.txt && echo "musl: III.4 held"

      # Every program's output goes to a file and the chain stops at the
      # first failure, which is why a red run here used to say nothing but
      # "exit code 1": the thread floor's aarch64 arm was red for three
      # commits before anyone could see the line it failed on. The files
      # are printed on the way out now, whichever way the chain ended.
      - name: aarch64, under emulation
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD/cross:/w" -w /w \
            debian:bookworm sh -c '
              apt-get update > /dev/null 2>&1 &&
              apt-get install -y --no-install-recommends gcc libgc-dev > /dev/null 2>&1 &&
              gcc hello-aarch64.o -o hello-aarch64 -lgc -lpthread &&
              ./hello-aarch64 > got.txt &&
              gcc conc-aarch64.o -o conc-aarch64 &&
              timeout 120 ./conc-aarch64 > conc.txt 2>&1 &&
              gcc floor-aarch64.o -o floor-aarch64 &&
              timeout 120 ./floor-aarch64 2 20 > floor.txt 2>&1 &&
              gcc threads-aarch64.o -o threads-aarch64 &&
              timeout 300 ./threads-aarch64 4 > threads.txt 2>&1
            ' || status=$?
          for out in got conc floor threads; do
            echo "== $out.txt"; cat "cross/$out.txt" 2>/dev/null || echo "(not written)"
          done
          [ "${status:-0}" -eq 0 ]
          diff cross/expected.txt cross/got.txt && echo "aarch64: same output"
          grep -q "every property held" cross/conc.txt && echo "aarch64: III.4 held"
          # Under emulation the numbers are qemu's; the properties are the
          # kernel's ABI and the asm, which is what this arm is for.
          grep -q "every property held" cross/floor.txt && echo "aarch64: the thread floor held"
          grep -q "every property held" cross/threads.txt && echo "aarch64: threads under the collector held"

  # darwin arm64 is a run target now (SPEC.md III.4.8): the concurrency
  # runtime's kqueue arm, the panic registry and every sample run natively on
  # the machine most developers sit in front of. The compiler is built here
  # rather than downloaded, because the artifact above is a Linux binary and
  # this job's whole point is the other platform. The gates are the same
  # ones a Linux push answers for: samples, III.4's exercise, III.1.4's
  # panics, III.9's floor — the darwin floor being "libSystem and nothing
  # else", which bench/dependency_floor.sh holds as an exact symbol list —
  # and the thread floor, whose darwin arm is the pthreads price by name.
  # And darwin is a ship target too: the job packages the same relocatable
  # tarball the Linux `binary` job does and proves it the same way, because
  # the first darwin package shipped Crystal's library flattened into one
  # directory (BSD cp's trailing-slash reading of `src/*/`) and only
  # unpacking it somewhere else could have caught that.
  darwin:
    runs-on: macos-14
    # Ninety, and the number is this job's own measurement rather than a
    # guess: the run before this one took 54m32s of a sixty-minute bound,
    # and 34 of those minutes are two steps nothing can shorten - building
    # the compiler, its daemon and the tarball (22m07s) and walking the
    # collector-free floor (11m32s). Five minutes of headroom is a red
    # build for the next step anybody adds, and the step that found this
    # was measured at 2m20s.
    timeout-minutes: 90
    name: "An iyi program, run on darwin arm64"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Crystal's compiler to bootstrap, coreutils for the gates' `timeout`,
      # pkgconf so `-Dgc_boehm` finds brew's bdw-gc (which already arrives
      # beside Crystal's compiler). brew's llvm is not asked for: the
      # compiler this job ships links the static one built below, and
      # the Crystal bootstrap brings whatever LLVM it needs for itself.
      - name: Install the bootstrap toolchain
        run: |
          brew install crystal coreutils pkgconf
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # The same diet the Linux tarball went on, from the same recipe file
      # (`scripts/build-static-llvm.sh`): 0.8.0's darwin package carried
      # brew's shared libLLVM in `lib/` and, by the bundler's fixed point,
      # everything it names outside `/usr/lib` and `/System` — because the
      # compiler linked `/opt/homebrew/opt/llvm`.
      # Now it links a static minimal LLVM, and with the collector off the
      # binaries `lib/` is empty rather than libgc alone. Built
      # on this runner because a static archive is bound to the libc++ and
      # SDK it was compiled against; cached on the recipe's hash and the
      # platform, so the build is paid once per recipe change. `$HOME`
      # rather than `/tmp`: darwin's `/tmp` is a symlink into `/private`,
      # and a cache path should not depend on how a symlink is archived.
      - name: Restore the static LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-static
          key: llvm-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-static-llvm.sh') }}
      - name: Build the static LLVM (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-static-llvm.sh "$HOME/llvm-static"

      # `iyi-tarball` builds `iyi` and its daemon in release mode, refuses an
      # unoptimised binary (`check_iyi_is_release`), and packages them — one
      # build pass, and every gate below runs against the compiler people
      # would actually download. The package script then reads the
      # direction off the binary: a static-LLVM compiler must ship no
      # libLLVM, and `otool -L` must name nothing outside the package but
      # `/usr/lib` and `/System`.
      - name: Build `iyi`, its daemon, and the tarball
        run: make iyi-tarball LLVM_CONFIG="$HOME/llvm-static/bin/llvm-config"

      - name: Samples
        run: |
          for sample in samples/iyi/*.iyi; do
            echo "== $sample"
            ./bin/iyi run "$sample" < /dev/null
          done

      - name: The concurrency gate (III.4)
        run: bash bench/concurrency_exercise.sh

      # The same shape on kqueue, where the event entry is 32 bytes
      # rather than 12 and the buffer the collector could not see is
      # 512 rather than 192.
      - name: A server's shape survives its own collector
        run: bash bench/server_load.sh

      - name: The panics gate (III.1.4)
        run: bash bench/panics.sh

      - name: The dependency floor (III.9)
        run: bash bench/dependency_floor.sh

      - name: The build tool floor
        run: bash bench/build_tool_floor.sh

      # A gate nobody runs is not a gate. This one rebuilds the compiler with
      # and without a collector, so it lives here rather than in a job that
      # would pay for a second toolchain: darwin is also where the property
      # was lost, because Apple's `malloc` hands back exactly the size asked
      # for while bdw-gc rounds a block up and hides a byte written past it.
      #
      # One run per sample rather than three, because CI is not the place to
      # measure a rate: the shapes it has to catch, a terminator outside its
      # allocation and a build that needs bdw-gc installed, fail on the first
      # run or not at all.
      # `LLVM_CONFIG` because this step rebuilds the compiler, and in this job
      # only the steps that rebuild are told where the static LLVM is. Without
      # it the gate reported "the compiler does not build with -Dgc_none",
      # which was true and had nothing to do with the collector.
      - name: The collector-free floor (III.9)
        run: |
          COLLECTOR_FREE_RUNS=1 LLVM_CONFIG="$HOME/llvm-static/bin/llvm-config" \
            bash bench/collector_free_floor.sh

      # What a thread costs *this* floor, where every call is libSystem's:
      # `pthread_create`, `pthread_kill`, `sigaction`, an `os_unfair_lock`
      # to park on, and `__tlv_bootstrap` for a `@[ThreadLocal]` — held as
      # the exact list, beside the runtime's twelve, with the pause printed
      # by count. The Linux arm is the samples job's; the aarch64 Linux arm
      # is cross-run's.
      - name: The thread floor (III.9, GC_DESIGN.md Stage 4)
        run: bash bench/thread_floor.sh

      # Threads under the collector on darwin: libSystem's pthreads, the
      # signal stop and the pipe park in the runtime rather than the probe,
      # held to the thread floor's exact list, with a live list in every
      # stopped thread's frames surviving the collections. The Linux arm
      # is the samples job's, the aarch64 arm is cross-run's.
      - name: Threads under the collector (GC_DESIGN.md Stage 4)
        run: bash bench/thread_exercise.sh

      - name: The parallel marker (GC_DESIGN.md Stage 7)
        run: bash bench/parallel_mark.sh

      - name: The mark beside the program (GC_DESIGN.md Stage 9)
        run: bash bench/concurrent_mark.sh

      # The race, for the record: the same three programs under iyi's
      # collector, Boehm and Go on this runner, so darwin's numbers are in
      # every log the way Linux's are in GC_DESIGN.md. A shared runner is
      # not a machine to gate on, and this step asserts nothing.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # Nothing here is a Go project, so there is no `go.sum` to key a
          # cache on and the default asks for one — a failed restore in
          # every darwin log, about a dependency file that will never exist.
          cache: false
      - name: The race, for the record (bench/gc_race.py)
        run: python3 bench/gc_race.py

      # The collector's gates, which the collector's own darwin arm (the
      # default allocator there since the flip) had never been held to in
      # CI: the samples job runs all five on Linux, and nothing ran them
      # here. Running them found what that costs — four gates whose darwin
      # allowlists predated the poller and the collector, and a release
      # build in which the trigger exercise's rooted spike was collected
      # because its global was written and never read, so the scavenge
      # measured nothing and no machine had noticed. The same defect the
      # samples job's comment records, on the other platform.
      - name: The collector holds, all six gates
        run: |
          bash bench/arena_exercise.sh
          bash bench/root_exercise.sh
          bash bench/mark_exercise.sh
          bash bench/sweep_exercise.sh
          bash bench/reuse_integrity.sh
          bash bench/collect_trigger.sh

      # The standard library's own gates, on the platform the darwin tarball
      # is shipped for. The std job runs all of them on Linux and nothing
      # ran them here, which is the same gap the collector's five had — and
      # it cost the same way: run on a darwin machine, six of them were red.
      # One was the module's (`File.touch` set "now" whatever second it was
      # given, because darwin's branch passed `utimes` a null), five were
      # the gates' own (a Python 3.11 oracle, an IR audit reading aarch64's
      # lowering, two floor lists that predated backtraces, proofs that
      # patched a branch this platform never compiles). Every one had been
      # green on Linux for a release. `std_exercise.sh` drives the whole
      # set and fails on any of them, and the gate-per-module rule with it.
      - name: The native standard library and its module exercises
        run: bash bench/std_exercise.sh

      # Budgeted, unlike the pauses above: the budget is generous by design
      # and a defer that blew it on a shared runner would be a finding.
      - name: A defer costs nanoseconds, and stays priced
        run: bash bench/defer_cost.sh

      - name: The language server session (III.8)
        run: python3 bench/lsp_session.py

      - name: The agent loop (check, fix, affected tests, mcp)
        run: python3 bench/agent_loop.py

      # The cheap deterministic gates the Linux push also answers — no
      # perf budgets (a shared runner's clock is weather), no network.
      # `packages_resolve` is here by lesson: its BSD-sed breakage was
      # found by running it on a Mac, and only a Mac can keep it fixed.
      - name: The packages story (III.7)
        run: bash bench/packages_resolve.sh

      - name: The test verb (III.8)
        run: bash bench/test_verb.sh

      # The same protocol edges on BSD sockets, where a peer that hangs
      # up mid-frame surfaces differently from Linux and the EPIPE path
      # that used to exit the daemon 0 is exactly the same code.
      - name: One client's mistake is one client's mistake
        run: python3 bench/daemon_protocol.py

      - name: Samples, from artifacts (R-1)
        run: bash bench/samples_roundtrip.sh

      - name: Token boundaries and the transport soak (III.8)
        run: |
          python3 bench/lsp_token_boundaries.py
          python3 bench/lsp_soak.py

      # `bench/lsp_positions.py` is the Linux job's and stays there, on
      # merit rather than on time: a cursor question is answered from the
      # typed program by the same front end on both kernels, so the sweep
      # measures nothing here that is darwin's. What *is* darwin's about
      # the server is the transport and the runtime under it, and
      # `lsp_session.py` and `lsp_soak.py` above run here for that. It was
      # measured here before it was moved out — 2m20s at stride 600 — so
      # this is a choice about repetition, not about the clock.

      # What a person who downloads it does: unpack it somewhere else and run
      # programs — iyi's own prelude with its kqueue runtime, `--crystal` with
      # Crystal's library, and the daemon serving builds. Nothing here may
      # need this checkout, a IYI_PATH, or a Crystal on the machine.
      - name: Unpack the tarball somewhere else and run from it
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf .build/iyi-*-darwin-*.tar.gz -C /tmp/unpacked
          cd /tmp
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run /tmp/unpacked/share/iyi/samples/hello.iyi
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi version
          printf 'order = ""\nch = Channel(Int32).new\ngroup do |g|\n  g.spawn do\n    value = ch.receive\n    order = order + (value.is_a?(Int32) ? value.to_s : "?")\n    0\n  end\n  g.spawn do\n    sleep(10)\n    order = order + "a"\n    ch.send(7)\n    0\n  end\nend\nputs order\n' > conc.iyi
          test "$(env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run conc.iyi)" = "a7"
          echo "the kqueue runtime runs out of the tarball"

      # The native standard library, out of the same tarball. `import std/text`
      # is a line a program writes, so it has to resolve from what was
      # downloaded and from nothing else — and on darwin especially, because
      # this is the platform whose `cp` semantics shipped a library flattened
      # into one directory once already. The gate moves the shipped directory
      # aside and requires the failure, so a package that carries std twice
      # cannot pass by accident.
      - name: The native standard library, out of the tarball
        run: bash bench/tarball_std.sh /tmp/unpacked

      - name: The other library, out of the tarball
        run: |
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run --crystal \
            /tmp/unpacked/share/iyi/samples/crystal/stdlib.iyi

      # The daemon, out of the same tarball, serving two builds from another
      # directory — the shape everything broken about it was about (IV.1d),
      # and on darwin also the binary whose `c/poll` was missing until the
      # port supplied it.
      - name: The daemon, out of the tarball
        run: |
          cd /tmp/unpacked
          env -u CRYSTAL_PATH ./bin/iyi daemon start --socket /tmp/iyi.sock &
          for _ in $(seq 1 120); do [ -S /tmp/iyi.sock ] && break; sleep 1; done
          mkdir -p /tmp/app && cd /tmp/app
          cp /tmp/unpacked/share/iyi/samples/hello.iyi .
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi daemon build \
            --socket /tmp/iyi.sock -o served hello.iyi
          ./served > served.txt
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi build -o normal hello.iyi
          ./normal > normal.txt
          diff normal.txt served.txt
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi daemon build \
            --socket /tmp/iyi.sock -o served2 hello.iyi
          echo "the daemon served two builds from another directory"

      # Staged out of `.build` for the reason the linux job's own copy
      # records: a wildcard under a hidden directory uploads nothing,
      # quietly. `error` makes the next one loud.
      - name: Stage the tarball for the release job
        run: mkdir -p dist && cp .build/iyi-*-darwin-*.tar.gz dist/

      - uses: actions/upload-artifact@v5
        with:
          name: iyi-darwin-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # A Windows binary, run twenty times, and every run held to the right
  # answer. Three things used to happen: it printed the right answer, it
  # printed memory it was never given (`ache\w` where `HELLO, IYI!` belongs,
  # or `BEEP ` with the digits gone), or it exited `0xC0000005`. The wild
  # write behind the last two was the prelude's memset, striding eight
  # elements per eight bytes, fixed with the collector's merge (SPEC III.9
  # 12c tells it whole); the probe grew a 50,000-iteration self-checked loop
  # so a packed-heap trample is probable rather than lucky, and this job
  # watched without failing until several clean builds in a row had read
  # twenty right and nothing else. Thirty-six in a row did — 720 runs, 36
  # million self-checks, no wrong output and no crash — and the watch is a
  # gate now: a wrong output or a crash fails the build by its tally.
  windows-probe:
    needs: cross-objects
    runs-on: windows-2022
    timeout-minutes: 30
    name: "What a Windows binary does, twenty times"
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cross-objects
          path: cross

      - uses: ilammy/msvc-dev-cmd@v1

      - name: What the object asks Windows for
        shell: cmd
        run: dumpbin /nologo /symbols cross\hello-windows.obj | findstr /C:"UNDEF"

      - name: One string, twenty runs, tallied
        shell: pwsh
        working-directory: cross
        run: |
          $command = (Get-Content strings-windows.link -Raw).Trim()
          Write-Host "linking with: $command"
          $parts = $command -split '\s+'
          & $parts[0] $parts[1..($parts.Length - 1)]
          if ($LASTEXITCODE -ne 0) { Write-Host "link failed with $LASTEXITCODE"; exit 0 }

          # Normalised before comparing, both sides: `Out-String` hands back CRLF
          # and the reference was written on Linux. The first version of this
          # probe skipped that and called twenty correct answers wrong.
          function normalise($text) { ($text -replace "`r`n", "`n").TrimEnd("`n") }

          $wanted = normalise (Get-Content strings-expected.txt -Raw)
          $right = 0
          $crashed = 0
          $wrong = 0

          foreach ($run in 1..20) {
            $got = normalise (.\strings-windows.exe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              $crashed = $crashed + 1
              Write-Host ("run {0,2}: exited {1}, output: {2}" -f $run, $LASTEXITCODE, $got)
            } elseif ($got -eq $wanted) {
              $right = $right + 1
            } else {
              $wrong = $wrong + 1
              Write-Host ("run {0,2}: {1}" -f $run, ($got -replace "`n", " | "))
            }
          }
          if ($crashed -gt 0) {
            Write-Host "Crash details from Application Event Log:"
            Get-EventLog -LogName Application -Newest 5 | Format-List
          }

          Write-Host ""
          Write-Host ("right {0} of 20, wrong output {1}, crashed {2}" -f $right, $wrong, $crashed)
          if ($right -ne 20) {
            Write-Host "a Windows binary answered wrong or crashed: the diagnosis SPEC III.9 12c retired is back"
            exit 1
          }
          exit 0

  # The GC Stage 10 Windows collector exercise on a real windows-2022 runner.
  windows-collector:
    needs: cross-objects
    runs-on: windows-2022
    timeout-minutes: 30
    name: "The collector on Windows x86_64"
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cross-objects
          path: cross

      - uses: ilammy/msvc-dev-cmd@v1

      - name: What the collector object asks Windows for
        shell: cmd
        run: dumpbin /nologo /symbols cross\windows_exercise.obj | findstr /C:"UNDEF"

      - name: Link and run the Windows collector exercise
        shell: pwsh
        working-directory: cross
        run: |
          $command = (Get-Content windows_exercise.link -Raw).Trim()
          Write-Host "linking with: $command"
          $parts = $command -split '\s+'
          & $parts[0] $parts[1..($parts.Length - 1)]
          if ($LASTEXITCODE -ne 0) {
            Write-Host "link failed with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $output = .\windows_exercise.exe
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            Write-Host "windows_exercise failed with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          $text = $output -join "`n"
          if ($text -notmatch "windows exercise: every check passed") {
            Write-Host "exercise output missing pass marker"
            exit 1
          }

  # The concurrency runtime exercise on a real windows-2022 runner.
  windows-runtime:
    needs: cross-objects
    runs-on: windows-2022
    timeout-minutes: 30
    name: "The concurrency runtime on Windows x86_64"
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cross-objects
          path: cross

      - uses: ilammy/msvc-dev-cmd@v1

      - name: What the runtime object asks Windows for
        shell: cmd
        run: dumpbin /nologo /symbols cross\runtime_exercise.obj | findstr /C:"UNDEF"

      - name: Run isolated TLS probe on Windows
        shell: pwsh
        working-directory: cross
        run: |
          $command = (Get-Content tls_probe.link -Raw).Trim()
          Write-Host "linking tls_probe with: $command"
          $parts = $command -split '\s+'
          & $parts[0] $parts[1..($parts.Length - 1)]
          if ($LASTEXITCODE -ne 0) {
            Write-Host "tls_probe link failed with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          .\tls_probe.exe
          Write-Host "tls_probe exit code: $LASTEXITCODE"

      - name: Link and run the Windows runtime exercise
        shell: pwsh
        working-directory: cross
        run: |
          $command = (Get-Content runtime_exercise.link -Raw).Trim()
          Write-Host "linking with: $command"
          $parts = $command -split '\s+'
          & $parts[0] $parts[1..($parts.Length - 1)]
          if ($LASTEXITCODE -ne 0) {
            Write-Host "link failed with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          .\runtime_exercise.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "runtime_exercise failed with $LASTEXITCODE"
            exit $LASTEXITCODE
          }

  # The compiler built on Windows by the machine that then runs what it
  # builds — the gate the three jobs above cannot be. They link objects
  # cross-compiled on Linux, so nothing in them ever compiled a program on
  # Windows, ran `iyi test`, read a directory or started a thread from a
  # Windows binary of the compiler. Everything that was wrong in that gap
  # was found by hand on a Windows 11 machine and is fixed; this job is
  # what keeps it fixed. It was red for all of it once: the compiler did
  # not build at all (`lib_llvm.cr`'s msvc path referenced a macro
  # variable nothing set), a multi-module program failed LLVM's verifier,
  # `Program.env` did not link, `iyi test` found no tests, and two threads
  # shared one allocator cache and corrupted the heap.
  #
  # No toolchain is set up beyond what a Windows developer already has:
  # the Visual C++ build tools for the linker and `rc`, and Crystal's own
  # Windows package, whose `lib` carries `LLVM-C.dll` and the
  # `llvm_VERSION` beside it — this fork needs no `llvm-config` on the
  # msvc path and the package ships none.
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 90
    name: "iyi, built and run on Windows"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      # `make` is what both makefiles are written for, and the image does
      # not promise it. The LLVM version is read rather than pinned: it is
      # whatever the Crystal package was built against, and both make's
      # readiness check and `src/llvm/lib_llvm.cr` want that number.
      - name: What this machine has
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
          }
          $lib = (crystal env CRYSTAL_LIBRARY_PATH).Trim()
          if (-not (Test-Path "$lib\llvm_VERSION")) {
            Write-Host "no llvm_VERSION beside the Crystal package's libraries, at $lib"
            exit 1
          }
          $llvm = (Get-Content "$lib\llvm_VERSION")[0].Trim()
          Write-Host "bootstrap libraries: $lib"
          Write-Host "llvm: $llvm"
          "CRYSTAL_LIBRARY_PATH=$lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LLVM_VERSION=$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the fork's compiler
        shell: cmd
        run: make -f Makefile.win crystal

      # `iyi` bakes `$ORIGIN\..\src` as its path, so the binary in `.build`
      # finds this checkout's prelude with nothing set in the environment:
      # every step below runs it the way a person would.
      - name: Build `iyi`
        shell: cmd
        run: make -f Makefile.win iyi

      - name: Every rule this fork adds, on Windows
        shell: cmd
        run: |
          .\bin\crystal spec --no-color ^
            spec\compiler\iyimod_spec.cr ^
            spec\compiler\iyi_import_spec.cr ^
            spec\compiler\semantic\iyi_spec.cr ^
            spec\compiler\iyi_derive_spec.cr ^
            spec\compiler\compiler_spec.cr

      # Each sample documents a part of the design, and `calc` reads, so
      # every one of them is given nothing on standard input rather than
      # the runner's closed handle. Every sample runs here now, `socket.iyi`
      # included: the native std has a Winsock arm, so the sample that used
      # to be skipped because `IyiSocket` refused by name is a sample that
      # connects, accepts and exchanges a message.
      - name: Run every sample
        shell: pwsh
        run: |
          $failed = @()
          foreach ($sample in Get-ChildItem samples\iyi\*.iyi) {
            Write-Host "== $($sample.Name)"
            "" | .\.build\iyi.exe run $sample.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $sample.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "samples that failed on Windows: $($failed -join ', ')"
            exit 1
          }

      # The verbs, run as a person runs them: a module's surface, a
      # type-check, the test glob (which found nothing on Windows for as
      # long as it built its pattern with backslashes), and a build.
      - name: The commands
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "verbs"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$work\main.iyi", "module main`r`n`r`nputs 1 + 1`r`n", $utf8)
          [System.IO.File]::WriteAllText("$work\alpha_test.iyi", "module alpha_test`r`n`r`nputs `"the test ran`"`r`n", $utf8)
          $iyi = "$pwd\.build\iyi.exe"
          & $iyi check "$work\main.iyi"; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iyi vet "$work\main.iyi"; if ($LASTEXITCODE -ne 0) { exit 1 }
          & $iyi build -o "$work\main.exe" "$work\main.iyi"; if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$work\main.exe"; if ($LASTEXITCODE -ne 0) { exit 1 }
          Push-Location $work
          $tests = & $iyi test
          Pop-Location
          Write-Host $tests
          if ($LASTEXITCODE -ne 0) { Write-Host "iyi test failed"; exit 1 }
          if (-not ($tests -match "1 passed")) {
            Write-Host "iyi test found no tests, which is what a backslash in a glob pattern does"
            exit 1
          }

      # Every exercise under bench/, run by the compiler built above. The
      # exclusions are named one by one, because a list nobody has to
      # justify is how a target quietly stops being tested:
      #
      #   std_http_server    a server, which waits for the client its own
      #                      gate supplies; a bare run has nobody to talk
      #                      to and would sit there until the job's timeout
      #   arena_large_probe  its pass *is* the memory fault, which
      #                      bench/arena_exercise.sh asserts and a tally
      #                      cannot
      #   wasm32_exercise    a wasm32 program
      #
      # The sockets came off this list when `std/socket` and `std/udp` got
      # their Winsock arms, and `std_file_exercise` came off it when the
      # exercise learned to ask Windows whether it may make a symbolic link
      # and to say what it skipped when the answer is no. `IYI_FILE_SANDBOX`
      # is what keeps that exercise out of `/tmp`, which is not a directory
      # here.
      - name: Every exercise the runtime can hold
        shell: pwsh
        run: |
          $skip = @(
            "std_http_server.iyi", "arena_large_probe.iyi", "wasm32_exercise.iyi"
          )
          $env:TEST_SANDBOX = Join-Path $env:RUNNER_TEMP "sandbox"
          $env:IYI_FILE_SANDBOX = Join-Path $env:RUNNER_TEMP "filesandbox"
          New-Item -ItemType Directory -Force -Path $env:TEST_SANDBOX | Out-Null
          New-Item -ItemType Directory -Force -Path $env:IYI_FILE_SANDBOX | Out-Null
          $iyi = "$pwd\.build\iyi.exe"
          $failed = @()
          $ran = 0
          foreach ($program in Get-ChildItem bench\*.iyi | Sort-Object Name) {
            if ($skip -contains $program.Name) { continue }
            $ran = $ran + 1
            # bench/std_path_exercise.sh pins these for the expand checks.
            if ($program.Name -eq "std_path_exercise.iyi") {
              $env:HOME = "/home/gate"; $env:PWD = "/pwd/gate"
            }
            "" | & $iyi run $program.FullName > "$env:RUNNER_TEMP\$($program.BaseName).out" 2>&1
            if ($LASTEXITCODE -ne 0) {
              $failed += $program.Name
              Write-Host "== $($program.Name) failed with $LASTEXITCODE"
              Get-Content "$env:RUNNER_TEMP\$($program.BaseName).out" | Select-Object -Last 15
            } else {
              Write-Host "ok   $($program.Name)"
            }
            if ($program.Name -eq "std_path_exercise.iyi") {
              Remove-Item Env:\HOME, Env:\PWD -ErrorAction SilentlyContinue
            }
          }
          Write-Host "$ran exercises run on Windows, $($failed.Count) failed"
          if ($failed.Count -gt 0) {
            Write-Host "failed: $($failed -join ', ')"
            exit 1
          }

      # The sentence a stack overflow prints is Windows' own: POSIX gets it
      # from `IyiStackGuard` on an alternate signal stack, which is compiled
      # out here, and Windows gets it from the vectored handler in
      # `src/iyi/prelude.iyi` — from the room `SetThreadStackGuarantee`
      # reserves on a thread's stack and the committed slack under the armed
      # guard page a fiber stack carries. `bench/panics.sh` asserts that
      # sentence, byte for byte, on the main stack, a fiber's and a thread's,
      # and that a wild `Pointer` is called a memory fault instead — and it
      # ran in the Linux and darwin jobs only, so the one platform the
      # sentence is about was the one platform nothing checked it on.
      - name: Panics, on the platform the sentence is about
        shell: bash
        run: bash bench/panics.sh

      # And the floor, for the same reason. The script has read a PE's import
      # table since Windows was a target — `dumpbin -imports`, located through
      # the installer the linker is found with — and the two jobs that ran it
      # were Linux and darwin, so what a Windows program asks of the machine
      # was a claim nothing measured. Missing `dumpbin` is a failure here
      # rather than a sentence and exit 0: a machine that built these binaries
      # has the toolchain that wrote them.
      - name: The dependency floor, on Windows (III.9)
        shell: bash
        run: bash bench/dependency_floor.sh

      # The module contract, on the platform whose paths are the reason to
      # ask. `mod context` resolves imports through `IYI_PATH` and a
      # workspace's `mods`, and `mod diff` hashes what a consumer compiles —
      # both of them path-shaped work that `cygpath` and a `;` separator are
      # the whole difference in. They ran on Linux and darwin only, so the
      # separator the gates carry code for was never exercised.
      - name: What a module contract says, on Windows
        shell: bash
        run: |
          bash bench/mod_context.sh
          bash bench/mod_diff.sh

      # The first verb a Windows person types, on the platform where the
      # old refusal was most wrong: it named a `crystal` binary in a
      # checkout, and the zip carries neither.
      - name: A project, from nothing, on Windows
        shell: bash
        run: bash bench/init_project.sh

      # The language server, on the platform whose file URIs are not the
      # path with a scheme in front: an editor sends
      # `file:///c%3A/Users/x/a.iyi`, and chopping the scheme off left
      # `/c:/Users/x/a.iyi`, a path with a root it does not have. Every
      # buffer the server opened on Windows was read from a file it could
      # not find, and nothing here had ever asked. The exe rather than
      # `bin/iyi`, which is a shell script, and its path spelled the way
      # the Windows python the runner carries can start it.
      - name: The language server holds its session, on Windows
        shell: bash
        run: |
          IYI="$(cygpath -m "$PWD")/.build/iyi.exe" python bench/lsp_session.py
          IYI="$(cygpath -m "$PWD")/.build/iyi.exe" python bench/lsp_artifacts.py

      # Four gates that carry Windows code — `cygpath`, the `;` separator,
      # the read-only directory Windows has no `chmod` for — and had never
      # run on Windows, so the code they carry for it was written blind.
      # What the verbs refuse, what the test verb answers, what a package
      # resolves to through `iyi.mod` and `iyi.sum`, and what `migrate`
      # writes: each is path-shaped work, and this is the platform whose
      # paths are the reason to ask. And the collector's reuse check
      # optimised: the exercise loop above runs `iyi run`, and the double
      # hand-out it catches showed in `--release` builds. And the
      # concurrency runtime's own gate, whose release arm is the one that
      # keeps a double in xmm6-xmm15 across a fiber switch, and whose
      # proof takes the switch's restore of them out. And Crystal's library
      # bound as boundaries: `JSON`, `INI` and `XML` read Windows'
      # file-private `ConsoleUtils` in object code that travels, which the
      # consumer could not name and so never emitted.
      - name: The gates that carry Windows code, on Windows
        shell: bash
        run: |
          bash bench/verbs_exercise.sh
          bash bench/test_verb.sh
          bash bench/packages_resolve.sh
          bash bench/migrate_gate.sh
          bash bench/reuse_integrity.sh
          bash bench/concurrency_exercise.sh
          bash bench/library_boundaries.sh

      # And the rest of what an editor and an agent are handed. Every
      # sample again from its modules' artifacts alone (R-1), the agent
      # loop and its MCP server, every cursor position in the repository's
      # own `.iyi` files, and every semantic token's boundary — the four
      # surfaces whose answers are paths and positions, which is what the
      # last three Windows fixes to the language server were about.
      #
      # The sweep at stride 600, not Linux's 200: at 200 it took 36 of this
      # job's 90 minutes, and what Windows adds to a cursor question is the
      # transport and the path under it, which every module still gets
      # asked about. Unbuffered, so a gate that stops says where it was.
      - name: The editor and agent surfaces, on Windows
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          export IYI="$(cygpath -m "$PWD")/.build/iyi.exe"
          bash bench/samples_roundtrip.sh
          python bench/agent_loop.py
          python bench/lsp_token_boundaries.py
          python bench/lsp_positions.py 600

      # The package a Windows person downloads, built and judged by the run
      # that builds the compiler. Kept inside this job rather than given its
      # own: a second job would check the tree out again and build
      # the compatibility binary before it could build `iyi` at all, which is
      # this job's minutes, to save the one release build below — the only
      # work here that is actually new.
      #
      # `-B` is that guard working rather than a way around it: the steps
      # above built an ordinary `iyi`, make finds it up to date by file
      # times, and `check_iyi_is_release` refuses to package an unoptimised
      # compiler. `-B` is what rebuilds it with `--release`.
      - name: Build the zip a Windows person downloads
        shell: cmd
        run: make -f Makefile.win -B iyi-zip release=1

      # What a person who downloads it does: unpack it somewhere that is not
      # this checkout and build a program out of it, with PATH cut down to
      # Windows' own directories so that nothing this job installed — the
      # the bootstrap compiler, its LLVM, the MSVC prompt — can answer for the
      # zip. The script's header says what that proves and what it does not.
      - name: The zip, unpacked elsewhere and built with PATH trimmed
        shell: pwsh
        run: .\scripts\package-windows.ps1

      # The one-liner, against the zip this run built and before a release
      # exists for it: -ReleaseUrl points the installer at a directory
      # holding the zip and the SHA256SUMS `iyi-zip` wrote, which is the file
      # the release job publishes beside it. The install runs under Windows
      # PowerShell 5.1, because that is the PowerShell somebody pasting the
      # one-liner has, and the refusal runs under PowerShell 7, so both hosts
      # are covered. Then the same directory with one hex digit wrong, which
      # has to be refused with nothing unpacked — an installer that verifies
      # is only worth having if this step can fail.
      - name: install.ps1 installs that zip, and refuses a wrong checksum
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item .build\iyi-*-windows-x86_64.zip -Destination $dist
          Copy-Item .build\SHA256SUMS -Destination $dist
          $zip = Get-ChildItem (Join-Path $dist 'iyi-*-windows-x86_64.zip')
          if ($zip.Name -notmatch '^iyi-(.+)-windows-x86_64\.zip$') {
            throw "unexpected asset name $($zip.Name)"
          }
          $version = $Matches[1]
          $prefix = Join-Path $env:RUNNER_TEMP 'installed'

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 `
            -ReleaseUrl $dist -Version $version -Prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with $LASTEXITCODE" }

          # The PATH edit, because the install is only useful if `iyi` is a
          # word the next terminal knows. It is the user's PATH in HKCU, so
          # nothing here needs administrator and the runner is thrown away.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$(Join-Path $prefix 'bin')*") {
            throw "install.ps1 did not add its bin to the user PATH: $userPath"
          }

          # The installed copy, run from a directory that is neither the
          # checkout nor the prefix, which is where a person's own project is.
          $work = Join-Path $env:RUNNER_TEMP 'project'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Push-Location $work
          & (Join-Path $prefix 'bin\iyi.exe') run (Join-Path $prefix 'share\iyi\samples\hello.iyi')
          if ($LASTEXITCODE -ne 0) { throw 'the installed iyi cannot run hello.iyi' }
          Pop-Location

          # And the whole install under PowerShell 7, into a prefix of its
          # own: the two hosts report a redirect's destination differently
          # and disagree about `-UseBasicParsing`, so the install is run by
          # both rather than the refusal alone. `-NoPath` because the PATH
          # edit is already proven above and the second one would only find
          # its own entry.
          $seven = Join-Path $env:RUNNER_TEMP 'installed-pwsh'
          pwsh -NoProfile -File .\install.ps1 -ReleaseUrl $dist -Version $version -Prefix $seven -NoPath
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 under PowerShell 7 failed with $LASTEXITCODE" }
          & (Join-Path $seven 'bin\iyi.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'the copy PowerShell 7 installed does not start' }

          # And over an install. `bench/install_upgrade.sh` holds this for
          # the tarball — a file an older release shipped and this one does
          # not survived the upgrade and was still *required* by a glob in
          # the library — and nothing held it for the zip, whose installer
          # takes a different route: it replaces `share\iyi` whole. Two
          # things are planted first, a stale file and a poisoned prelude,
          # and the poison is what proves the check can fail: `check` has
          # to break before the upgrade for its passing after to mean
          # anything.
          $installedExe = Join-Path $seven 'bin\iyi.exe'
          $stale = Join-Path $seven 'share\iyi\crystal\crystal\dwarf\gone_in_the_next_release.cr'
          New-Item -ItemType Directory -Force -Path (Split-Path $stale) | Out-Null
          [IO.File]::WriteAllText($stale, "module Crystal::DWARF`n  record LeftBehind, format : A_CONSTANT_THAT_IS_NOT_THERE`nend`n")
          $prelude = Join-Path $seven 'share\iyi\src\iyi\prelude.iyi'
          if (-not (Test-Path -LiteralPath $prelude)) { throw "the installed library has no prelude at $prelude" }
          [IO.File]::AppendAllText($prelude, "`nthis is not iyi`n")
          $probe = Join-Path $env:RUNNER_TEMP 'upgrade-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          [IO.File]::WriteAllText((Join-Path $probe 'main.iyi'), "puts 1`n")
          & $installedExe check (Join-Path $probe 'main.iyi') 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'a poisoned prelude still checked a program, so the upgrade check is watching nothing' }
          pwsh -NoProfile -File .\install.ps1 -ReleaseUrl $dist -Version $version -Prefix $seven -NoPath
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 over an install failed with $LASTEXITCODE" }
          if (Test-Path -LiteralPath $stale) { throw 'a file the release does not ship survived the upgrade' }
          & $installedExe check (Join-Path $probe 'main.iyi')
          if ($LASTEXITCODE -ne 0) { throw 'the upgraded library does not check a program' }
          Write-Host 'an install over an install leaves one install: the stale file is gone and the prelude is whole'

          # One hex digit wrong. `-RedirectStandardError`, because the
          # refusal is written to the process's own stderr and a `2>` inside
          # PowerShell only redirects PowerShell's error stream, which is how
          # this check first passed while capturing nothing.
          $sums = Join-Path $dist 'SHA256SUMS'
          $text = [IO.File]::ReadAllText($sums)
          $first = if ($text[0] -eq '0') { 'f' } else { '0' }
          [IO.File]::WriteAllText($sums, $first + $text.Substring(1))
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered'
          $refusal = Join-Path $env:RUNNER_TEMP 'refusal.txt'
          $child = Start-Process -FilePath 'pwsh' -RedirectStandardError $refusal -NoNewWindow -Wait -PassThru `
            -ArgumentList @('-NoProfile', '-File', '.\install.ps1', '-ReleaseUrl', "`"$dist`"",
                            '-Version', $version, '-Prefix', "`"$tampered`"", '-NoPath')
          $message = [IO.File]::ReadAllText($refusal)
          Write-Host $message
          if ($child.ExitCode -eq 0) { throw 'a zip that does not match SHA256SUMS was installed' }
          if ($message -notmatch "does not match the release's SHA256SUMS") {
            throw 'the refusal did not say why'
          }
          if (Test-Path (Join-Path $tampered 'bin\iyi.exe')) { throw 'something was unpacked anyway' }

      # The zip the three steps above proved is the artifact a release
      # attaches — built once, here, never rebuilt on somebody's laptop.
      # Staged out of `.build` first, and that is the whole bug the copy
      # exists for: upload-artifact excludes hidden paths by default, so a
      # wildcard under `.build/` matches nothing and the step says so in a
      # warning and passes. `error` is the rest of it: a release asset that
      # silently does not exist is worth a step to catch.
      - name: Stage the zip for the release job
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item .build\iyi-*-windows-x86_64.zip -Destination dist

      - uses: actions/upload-artifact@v5
        with:
          name: iyi-windows-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The standard library's gates and the collector's, on Windows, in a job
  # of their own: `bench/std_exercise.sh` runs every module's exercise from
  # source and from its artifacts, each with its oracle and its failure
  # proofs, and took 34 minutes on a Windows machine - more than the job
  # above has left. The same build, then the gates. They ran on Linux and
  # darwin only, and on Windows seven of them failed: python oracles that
  # wrote CRLF, proofs that edited another platform's arm, a floor read
  # with tools this platform does not have, and the collector's own
  # exercises refusing a platform whose collector they had never been
  # asked about.
  windows-std:
    runs-on: windows-2025
    timeout-minutes: 90
    name: "The standard library and the collector, gated on Windows"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: What this machine has
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
          }
          $lib = (crystal env CRYSTAL_LIBRARY_PATH).Trim()
          $llvm = (Get-Content "$lib\llvm_VERSION")[0].Trim()
          "CRYSTAL_LIBRARY_PATH=$lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LLVM_VERSION=$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the fork's compiler, then `iyi`
        shell: cmd
        run: |
          make -f Makefile.win crystal || exit /b 1
          make -f Makefile.win iyi

      - name: The collector's gates, on Windows
        shell: bash
        run: |
          bash bench/arena_exercise.sh
          bash bench/root_exercise.sh
          bash bench/mark_exercise.sh
          bash bench/sweep_exercise.sh
          bash bench/collect_trigger.sh
          bash bench/thread_exercise.sh

      - name: The standard library's gates, on Windows
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: bash bench/std_exercise.sh

  # wasm32-wasi, run rather than type-checked. The module imports four
  # `wasi_snapshot_preview1` functions and nothing else, and what makes it a
  # program a host can start is wasi-libc's entry stub — which calls
  # `__main_argc_argv`, not `main`. A module defining only `main` links without
  # complaint and traps on `unreachable` the moment the entry calls through the
  # weak reference it left behind; the prelude defines the name the entry
  # actually calls.
  #
  # Linked with the command `--cross-compile` prints, run as-is, with wasi-sdk's
  # clang as the `cc` it names — so the command a person is told to type is the
  # command that is tested.
  wasi-run:
    needs: [cross-objects, binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "An iyi program, run on wasm32-wasi"
    steps:
      # Checkout first: it clears the workspace, so an artifact downloaded
      # before it is an artifact deleted by it. The checkout and the
      # tarball are here so the two drivers below run as drivers rather
      # than as steps that copy what they do.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: cross-objects
          path: cross
      - uses: actions/download-artifact@v5
        with:
          name: iyi-linux-x86_64
          path: dist/

      # The toolchain, out of a cache when there is one. Both halves are
      # GitHub release assets, and the day github.com answered 504 for one
      # of them the error page was saved as the tarball and this step died
      # of "not in gzip format" - a red job about a download, on a commit
      # that changed no wasm. The installer fails on an HTTP error instead
      # of saving it, retries, falls back to the release API's asset
      # endpoint, and checks what arrived before extracting it; the cache
      # means a fetched toolchain is fetched once per pinned version, the
      # key being the script that pins them.
      - name: Restore the wasm toolchain
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: ~/wasm-toolchain
          key: wasm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-wasm-toolchain.sh') }}
      - name: Install wasi-sdk and wasmtime (cache miss)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-wasm-toolchain.sh "$HOME/wasm-toolchain"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Put the toolchain where the steps below look
        run: |
          sudo ln -sfn "$HOME/wasm-toolchain/wasi-sdk" /opt/wasi-sdk
          mkdir -p "$HOME/.wasmtime"
          ln -sfn "$HOME/wasm-toolchain/wasmtime/bin" "$HOME/.wasmtime/bin"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: What the module imports
        run: /opt/wasi-sdk/bin/llvm-nm --undefined-only cross/hello-wasi.wasm

      - name: Link with the command `--cross-compile` printed, and run it
        run: |
          # The driver the command names has to be one that can target wasi, and
          # `cc` lives beside `wasm-ld` in the same sysroot for clang to find it.
          ln -sf /opt/wasi-sdk/bin/clang /opt/wasi-sdk/bin/cc
          export PATH="/opt/wasi-sdk/bin:$PATH"
          command="$(cat cross/hello-wasi.link)"
          echo "linking with: $command"
          ( cd cross && eval "$command" )
          "$HOME/.wasmtime/bin/wasmtime" cross/hello-wasi > got.txt
          cat got.txt
          cmp cross/expected.txt got.txt && echo "wasm32-wasi: same output"

      # SPEC.md III.12, the sandbox story: an honest program computes
      # through the boundary; a theft of /etc/passwd dies named and
      # empty-handed under a default wasmtime, which preopens nothing; and
      # the refusal is the prelude's own sentence. These were its three
      # assertions copied into this file by hand, with the driver
      # `bench/sandbox_story.sh` running nowhere; now the driver runs, with
      # the tarball's compiler, because that is the one that works beside
      # wasmtime.
      #
      # The concurrency probe follows it for the same reason: it is the
      # measurement behind SPEC.md III.4's "no concurrency on wasm32-wasi",
      # and it had never run anywhere either — long enough for its first
      # step to go stale on an answer that is true on arm64 and false here.
      - name: The sandbox story and the concurrency wall, driven
        run: |
          mkdir -p room && tar -xzf dist/*.tar.gz -C room
          export IYI="$PWD/room/bin/iyi"
          bash bench/sandbox_story.sh
          bash bench/wasm_concurrency_probe.sh

  # GC Stage 10: wasm32-wasi collector exercise under wasmtime.
  #
  # The driver rather than a transcription of it. This job used to link and
  # run `bench/wasm32_exercise.iyi` plain and release and grep for the last
  # line — which is the first half of `bench/wasm32_exercise.sh`, copied by
  # hand. The half that was left behind is the half that makes it a gate:
  # three patched preludes that break reclamation, stack-root discovery and
  # layout precision, each of which has to make the exercise fail. That
  # driver ran nowhere.
  #
  # It needs a compiler beside wasmtime, and the container that can build
  # one cannot run wasmtime (its glibc is too old). The tarball crosses
  # that line: `clean-room` proves it starts on a machine with nothing on
  # it, so `IYI` points at the tarball's binary and the whole driver —
  # cross-compile, link with wasi-sdk's clang, run under wasmtime, and the
  # three proofs — happens here. Two seconds of work, wall clock aside.
  wasm32-collector:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "The collector on wasm32-wasi"
    steps:
      # Checkout first: it clears the workspace, so an artifact downloaded
      # before it is an artifact deleted by it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: iyi-linux-x86_64
          path: dist/

      # The same toolchain the wasi-run job restores, for the same reason.
      - name: Restore the wasm toolchain
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: ~/wasm-toolchain
          key: wasm-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-wasm-toolchain.sh') }}
      - name: Install wasi-sdk and wasmtime (cache miss)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bash scripts/install-wasm-toolchain.sh "$HOME/wasm-toolchain"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Put the toolchain where the driver looks
        run: |
          sudo ln -sfn "$HOME/wasm-toolchain/wasi-sdk" /opt/wasi-sdk
          mkdir -p "$HOME/.wasmtime"
          ln -sfn "$HOME/wasm-toolchain/wasmtime/bin" "$HOME/.wasmtime/bin"
          "$HOME/.wasmtime/bin/wasmtime" --version

      - name: The wasm32 collector gate, driver and proofs
        run: |
          mkdir -p room && tar -xzf dist/*.tar.gz -C room
          IYI="$PWD/room/bin/iyi" bash bench/wasm32_exercise.sh

  binary:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: crystallang/crystal:1.21.0-build
    name: "The iyi binary and its tarball"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
      - run: chmod +x .build/crystal

      # The tarball's LLVM is the static minimal one, built by
      # `scripts/build-static-llvm.sh` — Crystal's own recipe, measured
      # before it was adopted (0.6.0's Learned entry, collected):
      # BUILD_SHARED_LIBS=OFF, MinSizeRel, the five targets the compiler
      # reaches, every optional dependency OFF — so the 179 MB closure the
      # package used to carry (libLLVM and its libedit, libxml2, libicu,
      # libncursesw, libzstd) never comes into existence, and `lib/` is
      # libgc and libstdc++ at 3.4 MB. Built here, in this container,
      # because a static archive must be linked by the glibc it was compiled
      # against — an archive built on a newer machine is a link error or a
      # silent binary-for-newer-glibc on this one. Cached on the recipe
      # file's own hash and the runner's platform: editing the recipe is
      # what invalidates the cache, the platform token keeps a darwin
      # archive from ever being restored here (keys are repository-wide,
      # not per runner), and the roughly-an-hour build is paid once per
      # recipe change, not per push.
      - name: Restore the static LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-static
          key: llvm-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-static-llvm.sh') }}
      - name: Build the static LLVM (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          apt-get update -qq && apt-get install -y -qq cmake curl xz-utils > /dev/null
          bash scripts/build-static-llvm.sh /tmp/llvm-static

      # `iyi-tarball` alone, and the missing word is the whole of it. The target
      # carries `release := 1` and make applies that to what it builds *for this
      # goal* — so naming `iyi` first built an ordinary one, and the tarball then
      # found it up to date by file times and refused to package it. Which is
      # the guard working: an unoptimised release is what it was added to stop.
      - name: Build `iyi` and package it
        run: make -o .build/crystal iyi-tarball LLVM_CONFIG=/tmp/llvm-static/bin/llvm-config

      # What a person who downloads it does: unpack it somewhere else and run a
      # program. Nothing here may need this checkout, a IYI_PATH, or a
      # Crystal on the machine.
      - name: Unpack the tarball somewhere else and compile with it
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf .build/iyi-*-linux-*.tar.gz -C /tmp/unpacked
          cd /tmp
          # Both names unset, not just iyi's: the compiler falls back to
          # `CRYSTAL_PATH` so `crystal` keeps working, which means a stray one
          # in the environment would answer for the tarball and this would stop
          # proving the tarball is self-contained.
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run /tmp/unpacked/share/iyi/samples/hello.iyi
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi version

      # The library a program opts into, out of the tarball: every `src/std/`
      # module under its own name in `share/iyi/src/std`, each one imported and
      # run with both path variables unset. 0.11.0 shipped none of it and said
      # "can't find module 'std/enumerable'" to everybody who downloaded it,
      # and `hello.iyi` passed that release.
      - name: The native standard library, out of the tarball
        run: bash bench/tarball_std.sh /tmp/unpacked

      # Both libraries, because a tarball that ships one of them answers
      # `require "json"` with "can't find file" — the headline feature failing
      # in the thing people download, which is how this was found.
      - name: The other library, out of the tarball
        run: |
          env -u IYI_PATH -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run --crystal \
            /tmp/unpacked/share/iyi/samples/crystal/stdlib.iyi

      # And all of it, which is what "ships the library" has to mean. The
      # standard library requires `compiler/crystal/syntax` through its own
      # syntax highlighter, that was not shipped, and so `require "kemal"` —
      # this README's headline example — could not be built from the tarball
      # anybody downloaded. A sample cannot catch it: none of them requires a
      # shard. So the shard is made here.
      - name: A shard, out of the tarball
        run: |
          mkdir -p /tmp/shard/lib/page/src
          printf 'require "crystal/syntax_highlighter/html"\n' \
            > /tmp/shard/lib/page/src/page.cr
          printf 'module Page\n  def self.highlight(code : String) : String\n' \
            >> /tmp/shard/lib/page/src/page.cr
          printf '    Crystal::SyntaxHighlighter::HTML.highlight!(code)\n  end\nend\n' \
            >> /tmp/shard/lib/page/src/page.cr
          printf 'module main\n\nrequire "page"\n\nputs Page.highlight("1 + 1")\n' \
            > /tmp/shard/app.iyi
          cd /tmp/shard
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi run --crystal app.iyi

      # The daemon, out of the same tarball: started somewhere else, serving a
      # build in the shard project above. Everything about it that was broken
      # was about those two being different directories (SPEC.md IV.1d).
      - name: The daemon, out of the tarball
        run: |
          cd /tmp/unpacked
          env -u CRYSTAL_PATH ./bin/iyi daemon start --socket /tmp/iyi.sock &
          for _ in $(seq 1 120); do [ -S /tmp/iyi.sock ] && break; sleep 1; done
          cd /tmp/shard
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi daemon build \
            --socket /tmp/iyi.sock --crystal -o served app.iyi
          ./served > served.txt
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi build --crystal -o normal app.iyi
          ./normal > normal.txt
          diff normal.txt served.txt
          # Twice, because the daemon used to die after serving one build from
          # a directory that was not its own.
          env -u CRYSTAL_PATH /tmp/unpacked/bin/iyi daemon build \
            --socket /tmp/iyi.sock --crystal -o served app.iyi

      # The tarball the gates above just proved is the artifact a release
      # attaches — built once, here, never rebuilt on somebody's laptop.
      #
      # Staged out of `.build` first, and that is the whole bug this line
      # exists for: upload-artifact v4 excludes hidden paths by default,
      # so a *wildcard* under `.build/` matched nothing and the step said
      # so in a warning and passed. `.build/crystal` kept working because
      # a literal path makes its own directory the artifact root. So the
      # copy is not decoration, and `error` is the rest of it: a release
      # asset that silently does not exist is the failure mode worth
      # spending a step on.
      - name: Stage the tarball for the release job
        run: mkdir -p dist && cp .build/iyi-*-linux-*.tar.gz dist/

      - uses: actions/upload-artifact@v5
        with:
          name: iyi-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The gate whose absence let every release before this one ship a
  # `bin/iyi` that could not start. Every other proof of the tarball runs
  # in the environment that built it — where the libLLVM it linked against
  # is exactly the one it needs, so "unpack somewhere else and run" proved
  # the library path and nothing about the loader. This unpacks it in a
  # bare `ubuntu:24.04` with a C toolchain and nothing else: no LLVM, no
  # no bootstrap compiler, no iyi. If the package lacks what the loader wants,
  # this is where it says so.
  #
  # `gcc` is installed on purpose and it is the honest prerequisite: iyi
  # links through `cc`, so a machine that cannot compile C cannot finish
  # an iyi build. Everything else comes out of the tarball.
  clean-room:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: "The tarball, on a machine with nothing on it"
    steps:
      # Checkout first: it clears the workspace, so an artifact
      # downloaded before it is an artifact deleted by it.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: iyi-linux-x86_64
          path: dist/

      # The structural half, on the artifact rather than on a staging
      # directory: does the tarball name a library it does not carry?
      # Milliseconds, and it names the offender — where the docker run
      # below only says "cannot open shared object file".
      - name: The tarball names nothing it does not carry
        run: |
          mkdir -p room && tar -xzf dist/*.tar.gz -C room
          bash scripts/bundle-runtime-libs.sh room --verify-only

      - name: Unpack it in a bare image and build a program there
        run: |
          printf 'module hi\n\nputs "hello from a machine with nothing on it"\n' \
            > room/hi.iyi
          docker run --rm -v "$PWD/room:/iyi" ubuntu:24.04 sh -c '
            set -e
            apt-get update -qq && apt-get install -y -qq gcc > /dev/null
            /iyi/bin/iyi version
            cd /tmp
            /iyi/bin/iyi run /iyi/hi.iyi
            /iyi/bin/iyi run /iyi/share/iyi/samples/hello.iyi
            /iyi/bin/iyi vet /iyi/share/iyi/samples/hello.iyi
          '

      # The one-liner, on the tarball this run proved, before a release
      # exists for it: IYI_RELEASE_URL points the installer at a
      # directory holding the tarball and the SHA256SUMS the release job
      # will write the same way. Then the same directory with one hex
      # digit wrong, which has to be refused with nothing unpacked — an
      # installer that verifies is only worth having if this step can
      # fail.
      - name: install.sh installs the tarball, and refuses a wrong checksum
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          tarball="$(basename dist/*.tar.gz)"
          version="${tarball#iyi-}"; version="${version%-linux-x86_64.tar.gz}"
          export IYI_RELEASE_URL="file://$PWD/dist" IYI_VERSION="$version"
          IYI_PREFIX="$PWD/installed" sh install.sh
          env -u IYI_PATH -u CRYSTAL_PATH ./installed/bin/iyi run ./installed/share/iyi/samples/hello.iyi
          # And what the one-liner leaves behind is a library, not just a
          # binary: the same gate the tarball jobs run, against the prefix
          # `install.sh` wrote. This is the path a person actually takes.
          bash bench/tarball_std.sh "$PWD/installed"

          sed -i '1s/^0/X/; 1s/^[1-9a-f]/0/' dist/SHA256SUMS
          if IYI_PREFIX="$PWD/tampered" sh install.sh 2>err; then
            echo "a tarball that does not match SHA256SUMS was installed"; exit 1
          fi
          grep -q "does not match the release's SHA256SUMS" err
          [ ! -e tampered/bin/iyi ]

      # And the install *every machine that already has iyi* takes. The
      # step above unpacks into an empty directory, which only a
      # first-time user does; unpacking over an install used to leave
      # every file the release had deleted behind, and
      # `share/iyi/crystal` is a library whose `dwarf.cr` requires
      # `./dwarf/**` — so a file from an older release was still
      # *required*, and on a machine that had upgraded in place every
      # `--crystal` build died on a constant it mentioned. This installs,
      # plants that shape, installs again, and asks for the file to be
      # gone and the build to work.
      - name: Installing over an install leaves one install
        run: bash bench/install_upgrade.sh "$PWD/dist"

  # A release is a tag, and nothing else is manual: push `v*` and this
  # job collects the two tarballs the platform jobs built and *proved* —
  # unpacked somewhere else, samples run, daemon served — and attaches
  # them. The notes come from the annotated tag's own message, so the
  # sentence a release opens with is written where the version is named.
  #
  # Every job that *runs* something is named here. The four Windows and
  # wasm32 jobs and the cross-object audit were not, so a `v*` tag published
  # while the only jobs that execute on those two targets were red — and
  # README.md's portability claim is about targets a build is run on. A job
  # whose failure cannot stop a release is not protecting the claim it tests.
  # `windows-native` is here for the same reason and one more: it is the
  # only job that builds the compiler on Windows, so a tag cut while it is
  # red would ship a claim nobody on that platform can reproduce.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, darwin, clean-room, iyi, compiler-specs, stdlib-specs,
            samples, std, targets, cross-objects, cross-run, wasi-run,
            windows-probe, windows-collector, windows-runtime, windows-native, windows-std,
            wasm32-collector]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: iyi-linux-x86_64
          path: dist/
      - uses: actions/download-artifact@v5
        with:
          name: iyi-darwin-arm64
          path: dist/
      # And the Windows zip `windows-native` built, unpacked elsewhere and
      # installed by `install.ps1` in the same run. Without this line the
      # installer has nothing to download: it asks a release for
      # `iyi-<version>-windows-x86_64.zip` by name.
      - uses: actions/download-artifact@v5
        with:
          name: iyi-windows-x86_64
          path: dist/
      # The checksums ride beside the archives, and install.sh and
      # install.ps1 both refuse one that does not match them: what comes out
      # of an archive reaches the linker. One SHA256SUMS for every platform's
      # file, which is the file both installers read a line out of.
      - name: Create the release from the proven archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$tag" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for ${tag#v}." > notes.md
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)
          gh release create "$tag" --title "iyi ${tag#v}" --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS

  # The editor client is the only artifact here that is published somewhere
  # else, so it is proven the same way as the rest: every push packages it,
  # which is the one check that the manifest parses, the files it names
  # exist, and a `.vsix` comes out. It needs no compiler — the extension is
  # thirty lines that spawn `iyi lsp` — so it does not wait on `build`.
  #
  # One package, two registries. VS Code reads Microsoft's Marketplace;
  # Cursor, Windsurf, VSCodium, Gitpod and Theia read Open VSX, because
  # Microsoft's terms scope its marketplace to Microsoft's own products and
  # a fork may not use it. Publishing to one of them is publishing to some
  # of the editors that can run this client.
  #
  # The release is its own tag, `editor-v<version>`, and not the compiler's
  # `v*`: the extension's version moves on its own, and both registries
  # refuse a version they already carry, so riding every `v*` tag would fail
  # the second time a release shipped an unchanged client. The name cannot
  # start with `v` either, or the `release` job above would take a client
  # tag for a compiler one and cut a GitHub release from it.
  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: "The VS Code client packages, and a tag publishes it"
    # A step's `if` cannot read the `secrets` context, and the job's `env`
    # can: that is what lets a registry whose token is not set yet be
    # skipped instead of failing the tag that publishes to the other one.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Package the extension
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package

      # A tag that disagrees with the manifest publishes the wrong version
      # under the right name, and the Marketplace keeps what it is given.
      - name: The tag names the version the manifest carries
        if: startsWith(github.ref, 'refs/tags/editor-v')
        working-directory: editors/vscode
        run: |
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#editor-v}"
          [ "$manifest" = "$tag" ] || {
            echo "package.json says $manifest, the tag says $tag"
            exit 1
          }

      # `--packagePath` publishes the file the step above built and CI
      # already looked at, rather than packaging a second time.
      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/editor-v') && env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: |
          npx --yes @vscode/vsce publish \
            --packagePath "iyi-${GITHUB_REF_NAME#editor-v}.vsix"

      # The same file, to the registry every VS Code fork reads. `ovsx`
      # takes the token from OVSX_PAT, and the namespace must exist first:
      # `npx ovsx create-namespace iyilang`, once.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/editor-v') && env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx --yes ovsx publish "iyi-${GITHUB_REF_NAME#editor-v}.vsix"

      - uses: actions/upload-artifact@v5
        with:
          name: iyi-vscode
          path: editors/vscode/*.vsix
          retention-days: 7
