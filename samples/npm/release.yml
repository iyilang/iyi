# Copy to .github/workflows/release.yml in the program's repository.
# Configure an npm trusted publisher for each package and the npm environment.
name: Publish native packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, cpu: x64 }
          - { runner: macos-14, os: darwin, cpu: arm64 }
          - { runner: windows-2022, os: win32, cpu: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install iyi (checksum verified)
        shell: bash
        env:
          IYI_VERSION: '0.21.0'
          IYI_PREFIX: ${{ runner.temp }}/iyi
        run: |
          if [ '${{ matrix.os }}' = win32 ]; then
            curl -fsSL https://raw.githubusercontent.com/iyilang/iyi/v0.21.0/install.ps1 -o "$RUNNER_TEMP/install.ps1"
            powershell -ExecutionPolicy Bypass -File "$RUNNER_TEMP/install.ps1" -NoPath
          else
            curl -fsSL https://raw.githubusercontent.com/iyilang/iyi/v0.21.0/install.sh -o "$RUNNER_TEMP/install.sh"
            sh "$RUNNER_TEMP/install.sh"
          fi
      - name: Build and assemble
        shell: bash
        run: |
          exe=hello
          if [ '${{ matrix.os }}' = win32 ]; then exe=hello.exe; fi
          "$RUNNER_TEMP/iyi/bin/iyi" build --release -o "$RUNNER_TEMP/$exe" samples/iyi/hello.iyi
          node samples/npm/assemble.mjs "$RUNNER_TEMP/packages" '${{ matrix.os }}' '${{ matrix.cpu }}' "$RUNNER_TEMP/$exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.cpu }}
          path: ${{ runner.temp }}/packages/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: packages
      - name: Publish platform packages before the launcher
        shell: bash
        run: |
          # Artifact download does not preserve executable permissions.
          chmod +x packages/packages-{darwin-arm64,linux-x64}/hello-*/bin/hello
          chmod +x packages/packages-linux-x64/hello/bin/hello.js
          for dir in packages/packages-*/hello-*; do npm publish "$dir" --provenance --access public; done
          npm publish packages/packages-linux-x64/hello --provenance --access public
