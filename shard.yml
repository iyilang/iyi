name: iyi
version: 0.15.1

authors:
  - Serdar Dogruyol
  - Crystal Core Team <crystal@manas.tech>

description: |
  A language built for Developer & Agentic Experience, Portability,
  Performance, and Efficiency. A module is the unit of compilation and is
  compiled against its dependencies' declarations, never their bodies.
  Compatible with Crystal and its own language. The compiler is built on
  Crystal's and is Apache 2.0 with it.

crystal: ">= 1.13.0"

license: Apache-2.0 WITH Swift-exception

repository: https://github.com/jwaldrip/iyi
homepage: https://github.com/jwaldrip/iyi
documentation: https://github.com/jwaldrip/iyi/blob/master/SPEC.md
